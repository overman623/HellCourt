    <div class="modal-layer" id="verdictConfirmModal" aria-label="판결 확인 팝업">
      <div class="menu-popup">
        <div class="menu-popup-title">판결 확인</div>
        <div class="confirm-text" id="verdictConfirmText"></div>
        <nav class="popup-menu" id="verdictConfirmMenu"></nav>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <script src="assets/data/game-config.js"></script>
    <script src="assets/data/game-content.js"></script>
    <script src="assets/js/game.js"></script>
    <script>
      (function () {
        const Game = window.HellCourtGame;
        const ui = {
          screen: "title",
          titleIndex: 0,
          settingsIndex: 0,
          lobbyIndex: 0,
          eventIndex: 0,
          focusArea: "actions",
          actionIndex: 0,
          courtInfoOpen: false,
          courtInfoView: null,
          courtInfoIndex: 0,
          emptyMode: "blank",
          emptyIndex: 0,
          verdictIndex: 0,
          recordPage: 0,
          verdictChoice: "hell",
          verdictConfirmOpen: false,
          verdictConfirmIndex: 0,
          expediteIndex: 0,
          expediteChoice: "heaven",
          endIndex: 0,
          popupIndex: 0,
          settingsReturn: "title",
          unlockTimers: [],
          bubbleAwaiting: false,
          bubbleLocked: false,
          bubbleOpensRecord: false,
          bubbleIgnoreEnter: false,
          bubbleShownAt: 0,
        };

        const titleItems = [
          { id: "start", label: "재판 시작" },
          { id: "settings", label: "설정" },
        ];

        function showScreen(name) {
          ui.screen = name;
          ["title", "settings", "lobby", "ingame", "verdict", "expedite", "end"].forEach(function (s) {
            document.getElementById("screen-" + s).classList.toggle("active", s === name);
          });
        }

        const BGM = {
          audio: null,
          track: null,
          muted: false,
          paths() {
            const a = Game.contentAudio();
            return {
              court: a.bgm || "assets/audio/bgm_strict_verdict.mp3",
              heaven: a.bgmHeaven || "assets/audio/bgm_heaven_end.wav",
              hell: a.bgmHell || "assets/audio/bgm_hell_end.wav",
            };
          },
          volume() {
            return Game.balance().bgmVolume != null ? Game.balance().bgmVolume : 0.45;
          },
          loadMute() {
            try { this.muted = localStorage.getItem("hellcourt_bgm_muted") === "1"; }
            catch (e) { this.muted = false; }
          },
          setMuted(on) {
            this.muted = !!on;
            try { localStorage.setItem("hellcourt_bgm_muted", this.muted ? "1" : "0"); } catch (e) {}
            if (this.muted) this.stop();
          },
          toggleMuted() {
            this.setMuted(!this.muted);
            return this.muted;
          },
          stop() {
            if (!this.audio) return;
            this.audio.pause();
            this.audio.currentTime = 0;
            this.track = null;
          },
          play(track) {
            if (this.muted) return;
            const next = track || "court";
            const path = this.paths()[next];
            if (!path) return;
            if (!this.audio) {
              this.audio = new Audio();
            }
            this.audio.loop = next === "court";
            if (this.track !== next) {
              this.audio.src = path;
              this.track = next;
            }
            this.audio.volume = this.volume();
            this.audio.play().catch(function () {});
          },
        };

        function playSfx(kind) {
          const a = Game.contentAudio();
          const path = kind === "confirm" ? a.uiConfirm : a.uiSelect;
          if (!path) return;
          const sfx = new Audio(path);
          sfx.volume = Game.balance().sfxVolume != null ? Game.balance().sfxVolume : 0.55;
          sfx.play().catch(function () {});
        }

        function toast(msg) {
          const el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(function () { el.classList.remove("show"); }, 1800);
        }

        function applyArt() {
          const art = Game.contentArt();
          if (art.titleBg) document.documentElement.style.setProperty("--title-bg", 'url("' + art.titleBg + '")');
          if (art.ingameBg) document.documentElement.style.setProperty("--ingame-bg", 'url("' + art.ingameBg + '")');
          if (art.stageSoul) document.documentElement.style.setProperty("--stage-art", 'url("' + art.stageSoul + '")');
          if (art.stageSoul2) document.documentElement.style.setProperty("--stage-art-cover", 'url("' + art.stageSoul2 + '")');
        }

        function renderTitle() {
          const menu = document.getElementById("titleMenu");
          menu.innerHTML = "";
          titleItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "title-item" + (i === ui.titleIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.titleIndex = i;
              playSfx("select");
              confirmTitle();
            });
            menu.appendChild(btn);
          });
        }

        function settingsItems() {
          return [
            { id: "bgm", label: "BGM : " + (BGM.muted ? "OFF" : "ON") },
            { id: "back", label: "돌아가기" },
          ];
        }

        function renderSettings() {
          const menu = document.getElementById("settingsMenu");
          const items = settingsItems();
          ui._settingsItems = items;
          menu.innerHTML = "";
          items.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "settings-item" + (i === ui.settingsIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.settingsIndex = i;
              playSfx("select");
              confirmSettings();
            });
            menu.appendChild(btn);
          });
        }

        function confirmSettings() {
          const item = (ui._settingsItems || settingsItems())[ui.settingsIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "bgm") {
            BGM.toggleMuted();
            if (!BGM.muted) BGM.play("court");
            renderSettings();
            return;
          }
          if (ui.settingsReturn === "ingame" && Game.state && Game.state.phase === "trial") {
            showScreen("ingame");
            refreshTrial();
          } else {
            showScreen("title");
            renderTitle();
          }
        }

        function confirmTitle() {
          const item = titleItems[ui.titleIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "settings") {
            ui.settingsIndex = 0;
            ui.settingsReturn = "title";
            showScreen("settings");
            renderSettings();
            return;
          }
          Game.startNewRun();
          ui.lobbyIndex = 0;
          showScreen("lobby");
          renderLobby();
          setTimeout(function () { BGM.play("court"); }, 160);
        }

        function renderLobby() {
          const s = Game.state;
          if (!s || s.phase !== "lobby") return;
          const L = Game.labels();
          const remaining = s.today.filter(function (row) { return !row.verdict; }).length;
          const dutyDays = 100;
          const daysLeft = Math.max(0, dutyDays - s.day);
          document.getElementById("lobbyMeta").textContent =
            "Day " + s.day + " / " + dutyDays + " · 남은 근무일 " + daysLeft + "일" +
            " · 남은 법정시간 " + Game.formatCourtTime(s.courtTimeMinutes) +
            " · 금일 남은 망자 " + remaining + "/" + s.today.length;

          let text = "금일 망자 확인\n";
          s.today.forEach(function (row, i) {
            text += "\n" + (i + 1) + ". " + row.name + " · " + (row.verdict ? (row.verdict === "heaven" ? L.heaven : L.hell) : "미판결");
            if (row.summary) text += "\n   " + row.summary;
          });
          if (s.lastSummary) {
            text += "\n\n직전 판결\n" +
              "망자: " + s.lastSummary.deceasedName + "\n" +
              "판결: " + (s.lastSummary.choice === "heaven" ? L.heaven : L.hell) + "\n" +
              "확인 기록: 추가 사실 " + s.lastSummary.contextRead + "/" + s.lastSummary.eventCount +
              " · 감정과 의도 " + s.lastSummary.intentRead + "/" + s.lastSummary.eventCount + "\n" +
              "남은 시간: " + s.lastSummary.courtTimeLeftLabel;
          }
          if (s.dayJustAdvanced) text += "\n\n하루가 지나 법정시간과 금일 공판이 갱신되었습니다.";
          if (!remaining) text += "\n\n금일 재판 업무가 끝났습니다. 남은 시간은 자유시간으로 이어집니다.";
          document.getElementById("lobbySummary").textContent = text;

          const actions = [
            {
              id: "trial",
              label: remaining ? "망자 재판 시작" : "금일 재판 완료",
              primary: !!remaining,
              disabled: !remaining,
            },
            {
              id: "free",
              label: "자유시간 확인",
              primary: !remaining,
            },
            {
              id: "nextday",
              label: "다음 날로",
            },
            {
              id: "title",
              label: "타이틀로",
            },
          ];
          ui._lobbyActions = actions;
          if (ui.lobbyIndex >= actions.length) ui.lobbyIndex = 0;
          const wrap = document.getElementById("lobbyActions");
          wrap.innerHTML = "";
          actions.forEach(function (a, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.disabled = !!a.disabled;
            btn.className = "lobby-btn" + (a.primary ? " primary" : "") + (i === ui.lobbyIndex ? " selected" : "");
            btn.textContent = a.label;
            btn.addEventListener("click", function () {
              if (a.disabled) return;
              ui.lobbyIndex = i;
              playSfx("select");
              confirmLobby();
            });
            wrap.appendChild(btn);
          });
        }

        function confirmLobby() {
          const a = (ui._lobbyActions || [])[ui.lobbyIndex];
          if (!a || a.disabled) return;
          playSfx("confirm");
          if (a.id === "title") {
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          if (a.id === "free") {
            toast("자유시간 세부 콘텐츠는 아직 미확정입니다. 남은 시간: " + Game.formatCourtTime(Game.state.courtTimeMinutes));
            return;
          }
          if (a.id === "nextday") {
            Game.advanceDay();
            ui.lobbyIndex = 0;
            renderLobby();
            return;
          }
          const started = Game.startTrial();
          if (!started) {
            toast("재판할 망자가 없습니다.");
            renderLobby();
            return;
          }
          ui.eventIndex = 0;
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          ui.recordPage = 0;
          showScreen("ingame");
          refreshTrial(true);
          BGM.play("court");
        }

        function formatCostMinutes(n) {
          return "-" + n + "분";
        }

        function selectedEvent() {
          const s = Game.state;
          return s && s.events ? s.events[ui.eventIndex] : null;
        }

        function selectEventByIndex(index) {
          const s = Game.state;
          if (!s || !s.events.length) return;
          ui.eventIndex = (index + s.events.length) % s.events.length;
          const ev = selectedEvent();
          if (ev) Game.selectEvent(ev.id);
          refreshTrial();
        }

        function actionCount() {
          return (ui._trialActions || []).length || 4;
        }

        const COURT_INFO_VIEWS = ["today", "profile"];

        function trialFocusAreas() {
          if (ui.emptyMode === "verdict") {
            return ["actions", "verdictReview", "courtInfo", "record", "empty"];
          }
          if (ui.emptyMode === "blank" || ui.emptyMode === "events") {
            return ["actions", "courtInfo", "record"];
          }
          return ["actions", "courtInfo", "record", "empty"];
        }

        function courtInfoView() {
          return COURT_INFO_VIEWS[ui.courtInfoIndex] || "today";
        }

        function moveCourtInfoSelection(dir) {
          const n = COURT_INFO_VIEWS.length;
          ui.courtInfoIndex = (ui.courtInfoIndex + dir + n) % n;
          if (ui.courtInfoOpen) ui.courtInfoView = courtInfoView();
          refreshTrial();
        }

        function moveFocusArea(dir) {
          const areas = trialFocusAreas();
          let idx = areas.indexOf(ui.focusArea);
          if (idx < 0) idx = 0;
          ui.focusArea = areas[(idx + dir + areas.length) % areas.length];
          refreshTrial();
        }

        function setFocusArea(area) {
          if (ui.screen !== "ingame" || !Game.state || Game.state.phase !== "trial") return false;
          if (trialFocusAreas().indexOf(area) < 0) return false;
          if (ui.focusArea === area) return false;
          ui.focusArea = area;
          playSfx("select");
          refreshTrial();
          return true;
        }

        function moveTrialSelection(dir) {
          if (ui.focusArea !== "actions") return;
          const n = actionCount();
          if (!n) return;
          ui.actionIndex = (ui.actionIndex + dir + n) % n;
          refreshTrial();
        }

        function confirmTrialSelection() {
          if (ui.focusArea === "empty") {
            confirmEmptySelection();
            return;
          }
          if (ui.focusArea === "verdictReview") {
            return;
          }
          if (ui.focusArea === "courtInfo") {
            toggleCourtInfo(courtInfoView());
            return;
          }
          if (ui.focusArea === "record") {
            confirmRecord();
            return;
          }
          const action = (ui._trialActions || [])[ui.actionIndex];
          if (!action) return;
          if (action.id === "events") openEventRecord();
          else if (action.id === "interrogate") openInterrogatePicker();
          else confirmAction(action.id);
        }

        function readLabel(ev) {
          if (ev.contextRead && ev.intentRead) return "심문 완료";
          if (ev.contextRead) return "추가 사실 확인 중";
          return "기본 사건 공개 중";
        }

        function interrogationCostLabel(ev) {
          const s = Game.state;
          const costs = Game.actionCosts();
          if (!ev.contextRead) {
            const short = s && s.courtTimeMinutes < costs.contextTime ? " · 시간 부족" : "";
            return "추가사실 소모 예정 : " + costs.contextTime + "분" + short;
          }
          if (!ev.intentRead) {
            const short = s && s.courtTimeMinutes < costs.intentTime ? " · 시간 부족" : "";
            return "감정과 의도 소모 예정 : " + costs.intentTime + "분" + short;
          }
          return "소모 예정 : 없음";
        }

        function verdictLabel(choice) {
          return choice === "heaven" ? "무죄" : "유죄";
        }

        function verdictDescription(choice) {
          return choice === "heaven"
            ? "지옥으로 단죄하지 않고 천국으로 보냅니다."
            : "삶의 책임을 단죄하고 지옥으로 보냅니다.";
        }

        function renderActionPanel() {
          const panel = document.getElementById("actionPanel");
          if (!panel) return;
          panel.classList.toggle("selected", ui.focusArea === "actions");
        }

        function isActionSelected(id, index) {
          if (ui.focusArea === "actions" && ui.actionIndex === index) return true;
          if (id === "events" && ui.emptyMode === "events") return true;
          if (id === "interrogate" && ui.emptyMode === "interrogate") return true;
          if (id === "verdict" && ui.emptyMode === "verdict") return true;
          if (id === "menu" && ui.emptyMode === "menu") return true;
          return false;
        }

        function renderEvents() {
          const s = Game.state;
          const ev = selectedEvent();
          const btn = document.getElementById("eventsBtn");
          const sub = document.getElementById("eventsSub");
          btn.classList.toggle("selected", isActionSelected("events", 0));
          sub.textContent = "망자의 생애 기록을 열람합니다.";
        }

        function renderActions() {
          const actions = [
            { id: "events", label: "인생사건", sub: "망자의 생애 기록을 열람합니다.", icon: "assets/images/ui/icon_events.png", external: true },
            { id: "interrogate", label: "심문하기", sub: "심문할 사건을 선택합니다", icon: "assets/images/ui/icon_interrogate.png", external: true },
            { id: "verdict", label: "판결하기", sub: "무죄 / 유죄 선택", icon: "assets/images/ui/icon_verdict.png" },
            { id: "menu", label: "메뉴", sub: "설정 / 뒤로가기", icon: "assets/images/ui/icon_menu.png" },
          ];
          ui._trialActions = actions;
          const list = document.getElementById("actionList");
          list.innerHTML = "";
          actions.slice(2).forEach(function (a, offset) {
            const i = offset + 2;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.disabled = !!a.disabled;
            btn.className = "action-btn" + (isActionSelected(a.id, i) ? " selected" : "");
            btn.innerHTML =
              '<img class="action-icon" src="' + escapeHtml(a.icon) + '" alt="" aria-hidden="true">' +
              '<span class="action-copy">' + escapeHtml(a.label) +
              '<span class="sub">' + escapeHtml(a.sub || "") + "</span></span>";
            btn.addEventListener("click", function () {
              if (a.disabled) return;
              ui.focusArea = "actions";
              ui.actionIndex = i;
              playSfx("select");
              confirmAction(a.id);
            });
            list.appendChild(btn);
          });
        }

        function renderCourt() {
          const s = Game.state;
          document.getElementById("courtMeta").textContent =
            s.courtName || "염라의 법정";
          document.getElementById("trialSubject").textContent = "재판 중: " + s.name;
          if (s.sprite) {
            document.documentElement.style.setProperty("--soul-sprite", 'url("' + s.sprite + '")');
          }
        }

        function renderCourtBottom() {
          const s = Game.state;
          const L = Game.labels();
          document.getElementById("remainingValue").textContent = "남은 망자 " + Game.remainingSouls() + "명";
          document.getElementById("todayList").textContent = (s.today || []).map(function (row, i) {
            return (i + 1) + ". " + row.name + " · " +
              (row.verdict ? (row.verdict === "heaven" ? L.heaven : L.hell) : "미판결");
          }).join("\n");

          const vals = (s.values || []).join(", ") || "-";
          const conflicts = (s.coreConflictKeywords || []).join(", ") || "-";
          const life = (s.birthYear || "????") + " - " + (s.deathYear || "????") + (s.ageAtDeath != null ? " (" + s.ageAtDeath + "세)" : "");
          document.getElementById("profileBox").textContent =
            "이름: " + s.name + "\n" +
            "성별: " + (s.gender || "-") + "\n" +
            "생애: " + life + "\n" +
            "가치관: " + vals + "\n" +
            "갈등 키워드: " + conflicts + "\n\n" +
            (s.summary || "프로필 요약이 없습니다.");
          const todayBtn = document.getElementById("todayInfoBtn");
          const profileBtn = document.getElementById("profileInfoBtn");
          const drawer = document.getElementById("courtInfoDrawer");
          const todayPanel = document.getElementById("todayPanel");
          const profilePanel = document.getElementById("profilePanel");
          const grouped = ui.focusArea === "courtInfo";
          const showToday = ui.courtInfoOpen && ui.courtInfoView === "today";
          const showProfile = ui.courtInfoOpen && ui.courtInfoView === "profile";
          document.getElementById("profileBox").classList.toggle("selected", showProfile);
          todayBtn.classList.toggle("selected", grouped && ui.courtInfoIndex === 0);
          profileBtn.classList.toggle("selected", grouped && ui.courtInfoIndex === 1);
          todayBtn.setAttribute("aria-expanded", String(showToday));
          profileBtn.setAttribute("aria-expanded", String(showProfile));
          todayPanel.hidden = !showToday;
          profilePanel.hidden = !showProfile;
          drawer.classList.toggle("open", ui.courtInfoOpen);
          drawer.setAttribute("aria-hidden", String(!ui.courtInfoOpen));
        }

        function toggleCourtInfo(view, forceOpen) {
          const nextView = COURT_INFO_VIEWS.indexOf(view) >= 0 ? view : courtInfoView();
          if (typeof forceOpen === "boolean") {
            ui.courtInfoOpen = forceOpen;
            if (forceOpen) ui.courtInfoView = nextView;
          } else if (ui.courtInfoOpen && ui.courtInfoView === nextView) {
            ui.courtInfoOpen = false;
          } else {
            ui.courtInfoOpen = true;
            ui.courtInfoView = nextView;
          }
          ui.courtInfoIndex = Math.max(0, COURT_INFO_VIEWS.indexOf(nextView));
          ui.focusArea = "courtInfo";
          refreshTrial();
        }

        function renderEmpty() {
          const box = document.getElementById("emptyBox");
          const titleRow = document.getElementById("emptyTitleRow");
          const title = document.getElementById("emptyTitle");
          const costTitle = document.getElementById("emptyCostTitle");
          const page = document.getElementById("emptyPage");
          const interrogateArt = document.getElementById("emptyInterrogateArt");
          const verdictArt = document.getElementById("emptyVerdictArt");
          const menuArt = document.getElementById("emptyMenuArt");
          const eventsArt = document.getElementById("emptyEventsArt");
          const emptyActive =
            ui.focusArea === "empty" ||
            ui.emptyMode === "interrogate" ||
            ui.emptyMode === "verdict" ||
            ui.emptyMode === "menu";
          box.classList.toggle("selected", emptyActive);
          const s = Game.state;
          const showInterrogateArt = ui.emptyMode === "interrogate" && s && s.events && s.events.length;
          const showVerdictArt = ui.emptyMode === "verdict";
          const showMenuArt = ui.emptyMode === "menu";
          const showEventsArt = ui.emptyMode === "events";
          if (interrogateArt) interrogateArt.hidden = !showInterrogateArt;
          if (verdictArt) verdictArt.hidden = !showVerdictArt;
          if (menuArt) menuArt.hidden = !showMenuArt;
          if (eventsArt) eventsArt.hidden = !showEventsArt;
          const isBlank = ui.emptyMode === "blank";
          box.classList.toggle("is-inactive", isBlank);
          box.classList.toggle("is-events-only", showEventsArt);
          box.hidden = false;
          if (titleRow) titleRow.hidden = showEventsArt;
          if (costTitle) {
            costTitle.hidden = true;
            costTitle.textContent = "";
          }
          if (isBlank && ui.focusArea === "empty") {
            ui.focusArea = "actions";
            box.classList.remove("selected");
          }
          if (ui.emptyMode !== "interrogate" || !s || !s.events || !s.events.length) {
            if (ui.emptyMode === "verdict") {
              title.textContent = "판결 선택";
              page.textContent =
                (ui.verdictIndex === 0 ? "▶ " : "  ") + "무죄\n" +
                "   " + verdictDescription("heaven") + "\n\n" +
                (ui.verdictIndex === 1 ? "▶ " : "  ") + "유죄\n" +
                "   " + verdictDescription("hell");
            } else if (ui.emptyMode === "menu") {
              title.textContent = "메뉴";
              page.textContent = popupItems.map(function (item, i) {
                return (i === ui.popupIndex ? "▶ " : "  ") + item.label;
              }).join("\n\n");
            } else if (ui.emptyMode === "events") {
              title.textContent = "";
              page.textContent = "";
            } else {
              title.textContent = "EMPTY";
              page.textContent = "";
            }
            return;
          }
          title.textContent = "심문할 인생사건 선택";
          const focused = s.events[ui.emptyIndex] || s.events[0];
          if (costTitle && focused) {
            costTitle.hidden = false;
            costTitle.textContent = interrogationCostLabel(focused);
          }
          page.innerHTML = s.events.map(function (ev, i) {
            const mark = i === ui.emptyIndex ? "▶ " : "  ";
            const current = i === ui.eventIndex ? " · 현재 선택" : "";
            return (
              '<div class="empty-event' + (i === ui.emptyIndex ? " is-current" : "") + '">' +
              escapeHtml(mark + (i + 1) + ". " + (ev.year || "????") + " · " + ev.title + current) +
              "\n   " + escapeHtml(readLabel(ev)) +
              "</div>"
            );
          }).join("");
          const selected = page.querySelector(".empty-event.is-current");
          if (selected) selected.scrollIntoView({ block: "nearest" });
        }

        function openInterrogatePicker() {
          const s = Game.state;
          if (!s || !s.events || !s.events.length) return;
          ui.emptyMode = "interrogate";
          ui.emptyIndex = ui.eventIndex;
          ui.focusArea = "empty";
          setRecordOverlayActive(true);
          setCourtText("심문할 사건 선택", "우측 상단 목록에서 인생사건을 고르십시오.");
          refreshTrial();
        }

        function moveEmptySelection(dir) {
          if (ui.emptyMode === "verdict") {
            ui.verdictIndex = (ui.verdictIndex + dir + 2) % 2;
            renderEmpty();
            return;
          }
          if (ui.emptyMode === "menu") {
            ui.popupIndex = (ui.popupIndex + dir + popupItems.length) % popupItems.length;
            renderEmpty();
            return;
          }
          const s = Game.state;
          if (!s || !s.events || !s.events.length) return;
          ui.emptyIndex = (ui.emptyIndex + dir + s.events.length) % s.events.length;
          renderEmpty();
        }

        function confirmEmptySelection() {
          const s = Game.state;
          if (ui.emptyMode === "verdict") {
            ui.verdictChoice = ui.verdictIndex === 0 ? "heaven" : "hell";
            openVerdictConfirmPopup();
            return;
          }
          if (ui.emptyMode === "menu") {
            confirmMenuSelection();
            return;
          }
          if (ui.emptyMode !== "interrogate" || !s || !s.events || !s.events.length) return;
          ui.eventIndex = ui.emptyIndex;
          const ev = selectedEvent();
          if (ev) Game.selectEvent(ev.id);
          ui.focusArea = "actions";
          ui.actionIndex = 1;
          doInterrogate();
        }

        function renderTime() {
          const s = Game.state;
          const segs = document.getElementById("timeSegs");
          const hours = s.courtTimeHours || 8;
          const hoursLeft = Math.ceil((s.courtTimeMinutes || 0) / 60);
          segs.innerHTML = "";
          for (let i = 0; i < hours; i += 1) {
            const d = document.createElement("span");
            d.className = "seg" + (i < hoursLeft ? " on" : "");
            segs.appendChild(d);
          }
          document.getElementById("timeValue").textContent = Game.formatCourtTime(s.courtTimeMinutes);
        }

        function recordPages() {
          const s = Game.state;
          if (!s || !s.events || !s.events.length) {
            return [{ title: "기록 없음", text: "기록할 인생사건이 없습니다." }];
          }
          const pages = [];
          s.events.forEach(function (ev, i) {
            const head = (i + 1) + ". " + (ev.year || "????") + " · " + ev.title;
            const year = ev.year || "????";
            const eventTitle = ev.title || "이름 없는 사건";
            pages.push({
              eventId: ev.id,
              year: year,
              eventTitle: eventTitle,
              title: head + " · 기본 사건",
              text:
                head +
                (ev.age != null ? " (" + ev.age + "세)" : "") +
                "\n\n[기본 사건]\n" +
                (ev.summary || "기본 사건 정보가 없습니다."),
            });
            pages.push({
              eventId: ev.id,
              year: year,
              eventTitle: eventTitle,
              title: head + " · 추가 사실",
              text:
                head +
                "\n\n[추가 사실]\n" +
                (ev.contextRead ? (ev.contextText || "추가 사실 정보가 없습니다.") : "아직 조사하지 않았습니다."),
            });
            pages.push({
              eventId: ev.id,
              year: year,
              eventTitle: eventTitle,
              title: head + " · 감정과 의도",
              text:
                head +
                "\n\n[감정과 의도]\n" +
                (ev.intentRead ? (ev.intentText || "감정과 의도 정보가 없습니다.") : "아직 확인하지 않았습니다."),
            });
          });
          return pages;
        }

        function renderRecord() {
          const pages = recordPages();
          ui.recordPage = Math.max(0, Math.min(ui.recordPage, pages.length - 1));
          const page = pages[ui.recordPage];
          document.getElementById("recordBox").classList.toggle("selected", ui.focusArea === "record");
          const recordTitle = document.getElementById("recordTitle");
          if (recordTitle) {
            recordTitle.textContent = page.eventTitle
              ? (page.year || "????") + " · " + page.eventTitle
              : (page.title || "기록 없음");
          }
          document.getElementById("recordPageCount").textContent = (ui.recordPage + 1) + "/" + pages.length;
          document.getElementById("recordPageInfo").textContent = "PAGE " + (ui.recordPage + 1);
          document.getElementById("recordPage").textContent = page.text;
        }

        function verdictLockedText(unlocked, text, emptyLabel, lockedLabel) {
          if (!unlocked) {
            return '<div class="verdict-review-text verdict-review-locked">' + escapeHtml(lockedLabel) + "</div>";
          }
          return '<div class="verdict-review-text">' + escapeHtml(text || emptyLabel) + "</div>";
        }

        function verdictReviewMarkup() {
          const s = Game.state;
          if (!s) return "";
          const life =
            (s.birthYear || "????") + " - " + (s.deathYear || "????") +
            (s.ageAtDeath != null ? " (" + s.ageAtDeath + "세)" : "");
          let html =
            '<div class="verdict-review-block">' +
            '<div class="verdict-review-head">' + escapeHtml(s.name || "이름 없는 망자") + "</div>" +
            '<div class="verdict-review-sub">' + escapeHtml(life) + "</div>" +
            '<div class="verdict-review-text">' + escapeHtml(s.summary || "") + "</div>" +
            "</div>";
          (s.events || []).forEach(function (ev, i) {
            const head = (i + 1) + ". " + (ev.year || "????") + " · " + ev.title +
              (ev.age != null ? " (" + ev.age + "세)" : "");
            html +=
              '<div class="verdict-review-block">' +
              '<div class="verdict-review-head">' + escapeHtml(head) + "</div>" +
              '<div class="verdict-review-label">[기본 사건]</div>' +
              '<div class="verdict-review-text">' + escapeHtml(ev.summary || "기본 사건 정보가 없습니다.") + "</div>" +
              '<div class="verdict-review-label">[추가 사실]</div>' +
              verdictLockedText(ev.contextRead, ev.contextText, "추가 사실 정보가 없습니다.", "아직 조사하지 않았습니다.") +
              '<div class="verdict-review-label">[감정과 의도]</div>' +
              verdictLockedText(ev.intentRead, ev.intentText, "감정과 의도 정보가 없습니다.", "아직 확인하지 않았습니다.") +
              "</div>";
          });
          return html;
        }

        function renderVerdictReview() {
          const panel = document.getElementById("verdictReview");
          const title = document.getElementById("verdictReviewTitle");
          const body = document.getElementById("verdictReviewBody");
          if (!panel || !body) return;
          const show = ui.emptyMode === "verdict";
          const wasHidden = panel.hidden;
          panel.hidden = !show;
          panel.classList.toggle("selected", show && ui.focusArea === "verdictReview");
          if (!show) return;
          const s = Game.state;
          if (title) title.textContent = (s && s.name ? s.name + " · " : "") + "사건 기록";
          body.innerHTML = verdictReviewMarkup();
          if (wasHidden) body.scrollTop = 0;
        }

        function scrollVerdictReview(dir, amount) {
          const body = document.getElementById("verdictReviewBody");
          if (!body) return;
          body.scrollTop += (dir > 0 ? 1 : -1) * (amount || 48);
        }

        function moveRecordPage(dir) {
          const pages = recordPages();
          if (!pages.length) return;
          ui.recordPage = (ui.recordPage + dir + pages.length) % pages.length;
          syncEventFromRecordPage(pages[ui.recordPage]);
          renderRecord();
        }

        function setRecordOverlayActive(active) {
          const overlay = document.querySelector(".record-panel-overlay");
          if (overlay) overlay.hidden = !active;
        }

        function openRecordAtCurrentPage() {
          ui.focusArea = "record";
          ui.emptyMode = "events";
          ui.actionIndex = 0;
          setRecordOverlayActive(false);
          const pages = recordPages();
          if (pages.length) syncEventFromRecordPage(pages[ui.recordPage]);
          renderEvents();
          renderActions();
          renderInterrogate();
          renderActionPanel();
          renderEmpty();
          renderRecord();
        }

        function openEventRecord() {
          ui.recordPage = 0;
          ui.focusArea = "record";
          ui.emptyMode = "events";
          setRecordOverlayActive(false);
          syncEventFromRecordPage(recordPages()[0]);
          renderEvents();
          renderActions();
          renderInterrogate();
          renderActionPanel();
          renderEmpty();
          renderRecord();
        }

        function confirmRecord() {
          moveRecordPage(1);
        }

        function syncEventFromRecordPage(page) {
          const s = Game.state;
          if (!s || !page || !page.eventId) return;
          const idx = s.events.findIndex(function (ev) { return ev.id === page.eventId; });
          if (idx < 0) return;
          ui.eventIndex = idx;
          Game.selectEvent(page.eventId);
        }

        function setCourtText(main, sub) {
          document.getElementById("courtMain").textContent = main || "";
          document.getElementById("courtSub").textContent = sub || "";
        }

        function formatSoulSpeech(text) {
          const value = String(text || "").replace(/\r\n/g, "\n").trim();
          return value || "...";
        }

        function interrogationQuestion(type) {
          if (type === "context") {
            return "이 사건에 숨겨진 사실을 말해라.";
          }
          return "그때 네 감정과 의도는 무엇이었지?";
        }

        function formatPlayerSpeech(type, eventTitle) {
          const title = String(eventTitle || "").trim();
          const question = "“" + interrogationQuestion(type) + "”";
          return title ? title + "\n" + question : question;
        }

        function clearUnlockTimers() {
          while (ui.unlockTimers.length) clearTimeout(ui.unlockTimers.pop());
        }

        const BUBBLE_DISMISS_GRACE_MS = 700;

        function dismissBubbles() {
          clearUnlockTimers();
          const player = document.getElementById("playerBubble");
          const bubble = document.getElementById("soulBubble");
          player.classList.remove("show");
          bubble.classList.remove("show", "awaiting");
          ui.bubbleAwaiting = false;
          ui.bubbleLocked = false;
          ui.bubbleIgnoreEnter = false;
          ui.bubbleShownAt = 0;
          const shouldOpenRecord = ui.bubbleOpensRecord;
          ui.bubbleOpensRecord = false;
          if (shouldOpenRecord) openRecordAtCurrentPage();
        }

        function showUnlockEffect(type, text, eventTitle) {
          clearUnlockTimers();
          ui.bubbleAwaiting = false;
          ui.bubbleLocked = true;
          ui.bubbleOpensRecord = true;
          ui.bubbleIgnoreEnter = true;
          ui.bubbleShownAt = 0;
          const player = document.getElementById("playerBubble");
          const bubble = document.getElementById("soulBubble");
          const frame = document.getElementById("courtFrame");
          const record = document.getElementById("recordBox");
          player.textContent = formatPlayerSpeech(type, eventTitle);
          player.className = "player-bubble " + type;
          bubble.textContent = "";
          bubble.className = "soul-bubble " + type;
          frame.classList.remove("pulse");
          record.classList.remove("updated");
          void player.offsetWidth;
          player.classList.add("show");
          ui.unlockTimers.push(setTimeout(function () {
            bubble.textContent = "“" + formatSoulSpeech(text) + "”";
            bubble.className = "soul-bubble " + type;
            void bubble.offsetWidth;
            bubble.classList.add("show", "awaiting");
            ui.bubbleAwaiting = true;
            ui.bubbleShownAt = Date.now();
          }, 1050));
          frame.classList.add("pulse");
          record.classList.add("updated");
        }

        function refreshTrial(fresh) {
          const s = Game.state;
          if (!s || s.phase !== "trial") return;
          renderTime();
          renderCourt();
          renderCourtBottom();
          renderEvents();
          renderActions();
          renderInterrogate();
          renderActionPanel();
          renderEmpty();
          renderRecord();
          renderVerdictReview();
          if (fresh) {
            setCourtText(s.name + "의 재판이 시작되었다.", s.intro || "인생사건을 확인하고 필요한 만큼 조사하십시오.");
            const ev = selectedEvent();
            if (ev) Game.selectEvent(ev.id);
          }
        }

        function showBasic() {
          const r = Game.inspectBasic();
          if (!r.ok) return;
          ui.recordPage = ui.eventIndex * 3;
          setCourtText("기본 사건 확인", r.event.title);
          refreshTrial();
        }

        function renderInterrogate() {
          const btn = document.getElementById("interrogateBtn");
          const sub = document.getElementById("interrogateSub");
          btn.disabled = false;
          btn.classList.toggle("selected", isActionSelected("interrogate", 1));
          sub.textContent = "심문할 사건을 선택합니다";
        }

        function doContext() {
          const r = Game.investigateContext();
          if (!r.ok) {
            if (r.reason === "no_time") toast("남은 법정시간이 부족합니다.");
            else if (r.reason === "already") toast("이미 확인한 추가 사실입니다.");
            return;
          }
          playSfx("confirm");
          ui.recordPage = ui.eventIndex * 3 + 1;
          setCourtText("추가 사실 조사", r.event.title);
          refreshTrial();
          showUnlockEffect("context", r.speech, r.event.title);
        }

        function doIntent() {
          const r = Game.investigateIntent();
          if (!r.ok) {
            if (r.reason === "need_context") toast("먼저 추가 사실을 조사해야 합니다.");
            else if (r.reason === "no_time") toast("남은 법정시간이 부족합니다.");
            else if (r.reason === "already") toast("이미 확인한 감정과 의도입니다.");
            return;
          }
          playSfx("confirm");
          ui.recordPage = ui.eventIndex * 3 + 2;
          setCourtText("감정과 의도 확인", r.event.title);
          refreshTrial();
          showUnlockEffect("intent", r.speech, r.event.title);
        }

        function doInterrogate() {
          const ev = Game.getSelectedEvent();
          if (!ev) return;
          if (!ev.contextRead) {
            doContext();
            return;
          }
          if (!ev.intentRead) {
            doIntent();
            return;
          }
          toast("이 사건의 심문 기록은 모두 확인했습니다.");
        }

        function confirmAction(id) {
          if (id === "events") openEventRecord();
          else if (id === "verdict") openVerdictPicker();
          else if (id === "menu") openMenuPicker();
        }

        function openVerdictPicker() {
          if (!Game.state || Game.state.phase !== "trial") return;
          ui.emptyMode = "verdict";
          ui.verdictIndex = 0;
          ui.focusArea = "empty";
          setRecordOverlayActive(true);
          setCourtText("판결 선택", "중앙에서 사건을 확인하고 우측에서 무죄 또는 유죄를 선택하십시오.");
          refreshTrial();
        }

        const popupItems = [
          { id: "settings", label: "설정" },
          { id: "back", label: "뒤로가기" },
        ];

        function openMenuPicker() {
          ui.emptyMode = "menu";
          ui.popupIndex = 0;
          ui.focusArea = "empty";
          setRecordOverlayActive(true);
          setCourtText("메뉴", "우측 상단에서 항목을 선택하십시오.");
          refreshTrial();
        }

        const verdictConfirmItems = [
          { id: "confirm", label: "판결 확정" },
          { id: "back", label: "다시 선택" },
        ];

        function renderVerdictConfirmPopup() {
          const menu = document.getElementById("verdictConfirmMenu");
          const label = verdictLabel(ui.verdictChoice);
          document.getElementById("verdictConfirmText").textContent =
            label + " 판결을 확정하시겠습니까?\n" + verdictDescription(ui.verdictChoice);
          menu.innerHTML = "";
          verdictConfirmItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "popup-item" + (i === ui.verdictConfirmIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.verdictConfirmIndex = i;
              playSfx("select");
              confirmVerdictConfirmPopup();
            });
            menu.appendChild(btn);
          });
        }

        function openVerdictConfirmPopup() {
          ui.verdictConfirmOpen = true;
          ui.verdictConfirmIndex = 0;
          renderVerdictConfirmPopup();
          document.getElementById("verdictConfirmModal").classList.add("active");
        }

        function closeVerdictConfirmPopup() {
          ui.verdictConfirmOpen = false;
          document.getElementById("verdictConfirmModal").classList.remove("active");
        }

        function confirmVerdictConfirmPopup() {
          const item = verdictConfirmItems[ui.verdictConfirmIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "back") {
            closeVerdictConfirmPopup();
            return;
          }
          closeVerdictConfirmPopup();
          submitVerdictFromEmpty();
        }

        function confirmMenuSelection() {
          const item = popupItems[ui.popupIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "back") {
            ui.emptyMode = "blank";
            ui.focusArea = "actions";
            refreshTrial();
            return;
          }
          if (item.id === "settings") {
            ui.emptyMode = "blank";
            ui.settingsIndex = 0;
            ui.settingsReturn = "ingame";
            showScreen("settings");
            renderSettings();
            return;
          }
        }

        function openVerdict() {
          playSfx("confirm");
          const opened = Game.openVerdict();
          if (!opened.ok) return;
          ui.verdictChoice = "hell";
          document.getElementById("verdictReason").value = "";
          document.getElementById("verdictWarn").textContent =
            "판결에는 시스템이 정한 정답이 없습니다.\n현재까지 확보한 RECORD를 기준으로 천국 또는 지옥을 선택하십시오.";
          renderVerdictChoices();
          showScreen("verdict");
        }

        function submitVerdictFromEmpty() {
          const opened = Game.openVerdict();
          if (!opened.ok) return;
          const r = Game.submitVerdict(ui.verdictChoice, "");
          if (!r.ok) return;
          showVerdictEnd(r.summary);
        }

        function resetTrialUi() {
          ui.eventIndex = 0;
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          ui.emptyMode = "blank";
          ui.emptyIndex = 0;
          ui.recordPage = 0;
        }

        function startNextTrial() {
          const started = Game.startTrial();
          if (!started) {
            showLobbyFromEnd();
            return;
          }
          resetTrialUi();
          showScreen("ingame");
          refreshTrial(true);
          BGM.play("court");
        }

        function showLobbyFromEnd() {
          Game.finishToLobby();
          showScreen("lobby");
          renderLobby();
          BGM.play("court");
        }

        function shouldExpediteVerdicts() {
          return Game.remainingSouls() > 0 && (Game.courtTimeMinutes || 0) <= 0;
        }

        function showExpedite() {
          ui.expediteIndex = 0;
          ui.expediteChoice = "heaven";
          renderExpedite();
          showScreen("expedite");
        }

        function renderExpedite() {
          const rows = Game.remainingSoulRows();
          const row = rows[0];
          if (!row) {
            showLobbyFromEnd();
            return;
          }
          document.getElementById("expediteBody").textContent =
            "법정시간이 종료되었습니다.\n남은 망자는 정식 심문 없이 간이 판결로 처리합니다.\n\n" +
            "대상: " + row.name + "\n" +
            (row.summary || "프로필 요약이 없습니다.") + "\n\n" +
            "남은 망자: " + rows.length + "명";
          document.querySelectorAll("[data-expedite]").forEach(function (btn) {
            const choice = btn.getAttribute("data-expedite");
            btn.classList.toggle("selected", choice === ui.expediteChoice);
          });
        }

        function submitExpediteVerdict() {
          const row = Game.remainingSoulRows()[0];
          if (!row) {
            showLobbyFromEnd();
            return;
          }
          const r = Game.quickSubmitVerdict(row.index, ui.expediteChoice, "법정시간 종료 후 간이 판결");
          if (!r.ok) return;
          playSfx("confirm");
          if (Game.remainingSouls() > 0) {
            renderExpedite();
            return;
          }
          showLobbyFromEnd();
        }

        function renderVerdictChoices() {
          document.querySelectorAll("[data-choice]").forEach(function (btn) {
            btn.classList.toggle("selected", btn.getAttribute("data-choice") === ui.verdictChoice);
          });
        }

        function showVerdictEnd(summary) {
          const L = Game.labels();
          const art = Game.contentArt();
          const end = document.getElementById("screen-end");
          const isHeaven = ui.verdictChoice === "heaven";
          end.classList.toggle("is-heaven", isHeaven);
          end.classList.toggle("is-hell", !isHeaven);
          if (isHeaven && art.verdictHeaven) {
            end.style.backgroundImage = 'url("' + art.verdictHeaven + '")';
            BGM.play("heaven");
          } else if (!isHeaven && art.verdictHell) {
            end.style.backgroundImage = 'url("' + art.verdictHell + '")';
            BGM.play("hell");
          } else {
            end.style.backgroundImage = "";
          }
          document.getElementById("endTitle").textContent = isHeaven ? L.heaven : L.hell;
          document.getElementById("endLead").textContent = summary.deceasedName + "에 대한 판결이 확정되었다.";
          document.getElementById("endSub").textContent = "남은 법정시간 " + summary.courtTimeLeftLabel;
          ui.endIndex = 0;
          renderEndMenu();
          showScreen("end");
        }

        function submitVerdict() {
          const reason = document.getElementById("verdictReason").value || "";
          const r = Game.submitVerdict(ui.verdictChoice, reason);
          if (!r.ok) return;
          showVerdictEnd(r.summary);
        }

        function renderEndMenu() {
          const menu = document.getElementById("endMenu");
          const remaining = Game.remainingSouls();
          const nextLabel = shouldExpediteVerdicts()
            ? "남은 망자 간이 판결"
            : remaining > 0
              ? "다음 재판으로"
              : "로비로";
          const items = [
            { id: "continue", label: nextLabel },
            { id: "title", label: "심판종료" },
          ];
          ui._endItems = items;
          menu.innerHTML = "";
          items.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "end-menu-item" + (i === ui.endIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.endIndex = i;
              playSfx("select");
              renderEndMenu();
              confirmEnd();
            });
            menu.appendChild(btn);
          });
        }

        function confirmEnd() {
          const item = (ui._endItems || [])[ui.endIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "title") {
            Game.finishToLobby();
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          if (shouldExpediteVerdicts()) {
            showExpedite();
            return;
          }
          if (Game.remainingSouls() > 0) {
            startNextTrial();
            return;
          }
          showLobbyFromEnd();
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        document.querySelectorAll("[data-choice]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ui.verdictChoice = btn.getAttribute("data-choice");
            playSfx("select");
            renderVerdictChoices();
          });
        });
        document.querySelectorAll("[data-expedite]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ui.expediteChoice = btn.getAttribute("data-expedite");
            playSfx("select");
            renderExpedite();
            submitExpediteVerdict();
          });
        });
        document.getElementById("verdictSubmit").addEventListener("click", submitVerdict);
        document.getElementById("eventsBtn").addEventListener("click", function () {
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          playSfx("select");
          openEventRecord();
        });
        document.getElementById("interrogateBtn").addEventListener("click", function () {
          ui.focusArea = "actions";
          ui.actionIndex = 1;
          playSfx("select");
          openInterrogatePicker();
        });
        document.getElementById("todayInfoBtn").addEventListener("click", function () {
          playSfx("select");
          toggleCourtInfo("today");
        });
        document.getElementById("profileInfoBtn").addEventListener("click", function () {
          playSfx("select");
          toggleCourtInfo("profile");
        });
        document.getElementById("verdictConfirmModal").addEventListener("click", function (e) {
          if (e.target.id === "verdictConfirmModal") closeVerdictConfirmPopup();
        });
        document.getElementById("courtInfoDrawer").addEventListener("click", function () {
          ui.focusArea = "courtInfo";
          playSfx("select");
          refreshTrial();
        });
        document.querySelector('#screen-ingame [aria-label="ACTION"]').addEventListener("click", function (e) {
          if (e.target.closest("button")) return;
          setFocusArea("actions");
        });
        document.querySelector(".court-bottom").addEventListener("click", function (e) {
          if (e.target.closest("button")) return;
          setFocusArea("courtInfo");
        });
        document.getElementById("emptyBox").addEventListener("click", function () {
          setFocusArea("empty");
        });
        document.getElementById("verdictReview").addEventListener("click", function () {
          setFocusArea("verdictReview");
        });
        document.getElementById("recordBox").addEventListener("click", function (e) {
          const side = e.target.closest(".record-page-side");
          const changed = setFocusArea("record");
          if (!side) return;
          moveRecordPage(side.classList.contains("is-left") ? -1 : 1);
          if (!changed) playSfx("select");
        });
        document.getElementById("courtFrame").addEventListener("animationend", function () {
          this.classList.remove("pulse");
        });
        document.getElementById("recordBox").addEventListener("animationend", function () {
          this.classList.remove("updated");
        });
        document.querySelectorAll("#endMenu .end-menu-item").forEach(function (btn, i) {
          btn.addEventListener("click", function () {
            ui.endIndex = i;
            playSfx("select");
            renderEndMenu();
            confirmEnd();
          });
        });

        document.addEventListener("keydown", function (e) {
          if (ui.verdictConfirmOpen) {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.verdictConfirmIndex = (ui.verdictConfirmIndex + (e.key === "ArrowDown" ? 1 : -1) + verdictConfirmItems.length) % verdictConfirmItems.length;
              playSfx("select");
              renderVerdictConfirmPopup();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmVerdictConfirmPopup();
            } else if (e.key === "Escape") {
              e.preventDefault();
              closeVerdictConfirmPopup();
            }
            return;
          }
          if (ui.screen === "title") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.titleIndex = (ui.titleIndex + (e.key === "ArrowDown" ? 1 : -1) + titleItems.length) % titleItems.length;
              playSfx("select");
              renderTitle();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmTitle();
            }
            return;
          }
          if (ui.screen === "settings") {
            const items = ui._settingsItems || settingsItems();
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.settingsIndex = (ui.settingsIndex + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
              playSfx("select");
              renderSettings();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmSettings();
            } else if (e.key === "Escape") {
              e.preventDefault();
              if (ui.settingsReturn === "ingame" && Game.state && Game.state.phase === "trial") {
                showScreen("ingame");
                refreshTrial();
              } else {
                showScreen("title");
                renderTitle();
              }
            }
            return;
          }
          if (ui.screen === "lobby") {
            const n = (ui._lobbyActions || []).length;
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              ui.lobbyIndex = (ui.lobbyIndex + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
              playSfx("select");
              renderLobby();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmLobby();
            }
            return;
          }
          if (ui.screen === "verdict") {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              ui.verdictChoice = ui.verdictChoice === "hell" ? "heaven" : "hell";
              playSfx("select");
              renderVerdictChoices();
            } else if (e.key === "Enter") {
              e.preventDefault();
              submitVerdict();
            } else if (e.key === "Escape") {
              e.preventDefault();
              Game.state.phase = "trial";
              showScreen("ingame");
              refreshTrial();
            }
            return;
          }
          if (ui.screen === "expedite") {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.expediteChoice = ui.expediteChoice === "hell" ? "heaven" : "hell";
              playSfx("select");
              renderExpedite();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              submitExpediteVerdict();
            }
            return;
          }
          if (ui.screen === "end") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.endIndex = (ui.endIndex + (e.key === "ArrowDown" ? 1 : -1) + 2) % 2;
              playSfx("select");
              renderEndMenu();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmEnd();
            }
            return;
          }
          if (ui.screen !== "ingame" || !Game.state || Game.state.phase !== "trial") return;
          if (ui.bubbleLocked) {
            e.preventDefault();
            if (e.repeat) return;
            if (e.key !== "Enter") return;
            if (ui.bubbleIgnoreEnter) return;
            if (!ui.bubbleAwaiting) return;
            if (!ui.bubbleShownAt || Date.now() - ui.bubbleShownAt < BUBBLE_DISMISS_GRACE_MS) return;
            dismissBubbles();
            playSfx("select");
            return;
          }
          if (e.key === "Tab") {
            e.preventDefault();
            moveFocusArea(e.shiftKey ? -1 : 1);
            playSfx("select");
          } else if (ui.focusArea === "courtInfo" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
            e.preventDefault();
            moveCourtInfoSelection(e.key === "ArrowLeft" ? -1 : 1);
            playSfx("select");
          } else if (ui.focusArea === "courtInfo" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            if (ui.courtInfoOpen) {
              const scrollEl = ui.courtInfoView === "profile"
                ? document.getElementById("profileBox")
                : document.getElementById("todayList");
              if (scrollEl) scrollEl.scrollTop += e.key === "ArrowDown" ? 36 : -36;
            }
          } else if (ui.focusArea === "verdictReview" && (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "PageUp" || e.key === "PageDown")) {
            e.preventDefault();
            if (e.key === "PageUp" || e.key === "PageDown") {
              const body = document.getElementById("verdictReviewBody");
              const step = body ? Math.max(120, Math.floor(body.clientHeight * 0.85)) : 180;
              scrollVerdictReview(e.key === "PageDown" ? 1 : -1, step);
            } else {
              scrollVerdictReview(e.key === "ArrowDown" ? 1 : -1, 48);
            }
          } else if (ui.focusArea === "empty" && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            moveEmptySelection(e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1);
            playSfx("select");
          } else if (ui.focusArea === "record" && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
            e.preventDefault();
            moveRecordPage(e.key === "ArrowLeft" ? -1 : 1);
            playSfx("select");
          } else if (ui.focusArea === "actions" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            moveTrialSelection(e.key === "ArrowDown" ? 1 : -1);
            playSfx("select");
          } else if (e.key === "Enter") {
            e.preventDefault();
            confirmTrialSelection();
          } else if (e.key === "1") {
            e.preventDefault();
            ui.focusArea = "actions";
            ui.actionIndex = 0;
            openEventRecord();
          } else if (e.key === " ") {
            e.preventDefault();
            ui.focusArea = "actions";
            ui.actionIndex = 1;
            openInterrogatePicker();
          } else if (e.key.toLowerCase() === "v") {
            e.preventDefault();
            openVerdictPicker();
          } else if (e.key === "Escape") {
            e.preventDefault();
            if (ui.courtInfoOpen) {
              toggleCourtInfo(courtInfoView(), false);
            } else if (ui.emptyMode !== "blank") {
              ui.emptyMode = "blank";
              ui.focusArea = "actions";
              refreshTrial();
            }
          }
        });

        document.addEventListener("keyup", function (e) {
          if (e.key === "Enter") ui.bubbleIgnoreEnter = false;
        });

        BGM.loadMute();
        applyArt();
        renderTitle();
        console.info("[지옥법정] current-planning MVP boot", {
          config: window.GAME_CONFIG && window.GAME_CONFIG.version,
          content: window.GAME_CONTENT && window.GAME_CONTENT.version,
        });
      })();
    </script>
  </body>
</html>
