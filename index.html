<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지옥법정</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #050505;
        --panel: rgba(0, 0, 0, 0.74);
        --panel-soft: #000000;
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.58);
        --line: rgba(242, 242, 242, 0.56);
        --focus: #f0c14b;
        --focus-glow: rgba(240, 193, 75, 0.95);
        --focus-line: rgba(240, 193, 75, 0.72);
        --focus-fill: rgba(240, 193, 75, 0.22);
        --hell: #c62828;
        --heaven: #9fd1ff;
      }

      @font-face {
        font-family: "GameUI";
        src: url("assets/fonts/PF_start_dust_3.0_ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "GameUI", "Malgun Gothic", sans-serif;
      }
      button, textarea { font: inherit; color: inherit; }
      button { background: none; border: none; cursor: pointer; padding: 0; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .screen {
        position: absolute; inset: 0; display: none;
        flex-direction: column; align-items: center; justify-content: center;
      }
      .screen.active { display: flex; }
      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .panel-title {
        padding: 0.55rem 0.7rem;
        border-bottom: 1px solid rgba(255,255,255,0.28);
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      .panel-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .panel-body { padding: 0.75rem; }
      /* 프레임 안쪽 검정 면을 팔각 채움 이미지로 대체 */
      .panel-court-name {
        background-color: #000000;
        background-image: url("assets/images/ui/panel_fill.png");
        background-repeat: no-repeat;
        background-position: center;
        background-size: 100% 100%;
        background-origin: border-box;
        background-clip: border-box;
      }
      /* 좌측 ACTION 상단: 제목/본문 분리 없이 법정명 한 줄 */
      .panel-court-name {
        border: 14px solid transparent;
        border-image-source: url("assets/images/ui/court_name_frame.png");
        border-image-slice: 24;
        border-image-width: 14px;
        border-image-repeat: stretch;
        image-rendering: pixelated;
      }
      .panel-court-name .panel-body {
        padding: 0.55rem 0.75rem;
      }
      .panel-action-spacer {
        border: 1px solid #ffffff;
        background: #000000;
        flex: 0 0 auto;
        min-height: 6rem;
        max-height: 8rem;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .panel-action-spacer .court-caption {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      #courtMeta {
        font-size: 2rem;
        letter-spacing: 0.06em;
        line-height: 1.35;
        text-align: center;
      }
      /* 중앙 상단: 재판 중 대상명 */
      .panel-trial-subject {
        border: 12px solid transparent;
        border-image-source: url("assets/images/ui/trial_subject_frame_fill.png");
        border-image-slice: 24 fill;
        border-image-width: 12px;
        border-image-repeat: stretch;
        background: transparent;
        image-rendering: pixelated;
      }
      .panel-trial-subject .panel-body {
        padding: 0.55rem 0.85rem;
        text-align: center;
      }
      /* 법정시간: 팔각 패널 프레임을 9-slice로 감쌈 */
      .panel-court-time {
        border: 12px solid transparent;
        border-image-source: url("assets/images/ui/court_time_frame.png");
        border-image-slice: 12 fill;
        border-image-width: 12px;
        border-image-repeat: stretch;
        background: transparent;
        image-rendering: pixelated;
      }
      .panel-court-time .panel-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.45rem;
        border-bottom-color: rgba(255, 255, 255, 0.22);
      }
      .panel-court-time .panel-title-label {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        min-width: 0;
      }
      .panel-court-time .panel-title-icon {
        width: 1.1rem;
        height: 1.1rem;
        flex: 0 0 auto;
        object-fit: contain;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .panel-court-time #timeValue {
        min-width: 3.5rem;
        text-align: right;
        color: var(--text);
        font-variant-numeric: tabular-nums;
      }

      #screen-title {
        justify-content: flex-end;
        padding-bottom: clamp(4rem, 12vh, 7rem);
        background: var(--title-bg, #050505) center / cover no-repeat;
        image-rendering: pixelated;
      }
      .title-menu, .settings-menu, .end-menu {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        align-items: stretch;
      }
      .title-item, .settings-item, .end-menu-item, .lobby-btn, .action-btn, .verdict-choice, .verdict-submit {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 0.72rem 1rem;
        text-align: left;
        min-height: 2.6rem;
      }
      .title-item { min-width: 14rem; text-align: center; }
      .selected, .title-item.selected, .settings-item.selected, .end-menu-item.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      button:disabled {
        opacity: 0.38;
        cursor: default;
      }

      #screen-settings, #screen-lobby, #screen-verdict, #screen-expedite {
        background: #050505;
        padding: 2rem;
      }
      .settings-card, .lobby-card, .verdict-card, .expedite-card {
        width: min(860px, 94vw);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 1.25rem;
      }
      .settings-card h1, .lobby-card h1, .verdict-card h2, .expedite-card h2 {
        margin: 0 0 1rem;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
      }
      .expedite-body {
        white-space: pre-wrap;
        line-height: 1.55;
        min-height: 8rem;
        margin-bottom: 1rem;
        color: var(--muted);
      }
      .lobby-meta, .lobby-summary {
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .lobby-meta { color: var(--muted); margin-bottom: 0.8rem; }
      .lobby-summary {
        min-height: 8rem;
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.9rem;
        margin-bottom: 1rem;
      }
      .lobby-actions {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      .lobby-btn.primary { border-color: var(--heaven); color: var(--heaven); }

      #screen-ingame {
        align-items: stretch;
        justify-content: stretch;
        background: #050505;
      }
      .ingame-backdrop {
        position: relative;
        flex: 1;
        min-height: 0;
        width: auto;
        align-self: stretch;
        display: flex;
        align-items: stretch;
        justify-content: stretch;
        box-sizing: border-box;
        margin: 0.85rem;
        padding: 0;
        background: #050505;
        border: 32px solid transparent;
        border-image-source: url("assets/images/ui/ingame_frame.png");
        border-image-slice: 40;
        border-image-width: 32px;
        border-image-repeat: stretch;
        image-rendering: pixelated;
      }
      .ingame-backdrop::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: var(--ingame-bg, none) center / cover no-repeat;
        opacity: 0.3;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .ingame-backdrop > * {
        position: relative;
        z-index: 1;
      }
      .trial-shell {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(240px, 24%) minmax(400px, 46%) minmax(300px, 30%);
        grid-template-rows: minmax(0, 1fr);
        gap: 0.75rem;
        padding: 0.9rem;
        width: 100%;
        max-width: 1700px;
        margin: 0 auto;
        min-height: 0;
      }
      .col {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      /* 우측 EMPTY를 중앙 '재판 중' 패널 아래로 맞춤 */
      .col[aria-label="RIGHT SIDE"] {
        padding-top: calc(24px + 1.1rem + 1.25em + 0.65rem);
      }
      .hud {
        display: grid;
        gap: 0.5rem;
      }
      .hud-row {
        display: flex;
        align-items: stretch;
        gap: 0.5rem;
      }
      .hud-label { color: var(--muted); min-width: 4.5rem; }
      .seg-track {
        flex: 1;
        display: flex;
        align-items: stretch;
        gap: 4px;
      }
      .seg {
        flex: 1 1 0;
        min-width: 0;
        aspect-ratio: 1 / 1;
        height: auto;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.1);
        box-sizing: border-box;
      }
      .seg.on {
        border-color: #fff;
        background: #e8e8e8;
      }
      .hud-value { min-width: 4.5rem; text-align: right; }
      .action-list, .event-list, .record-list {
        overflow: auto;
        min-height: 0;
      }
      .action-list { display: flex; flex-direction: column; gap: 0.45rem; }
      .action-panel {
        flex: 0 0 auto;
        display: flex;
        flex-direction: column;
        gap: 0.45rem;
        min-height: 0;
        border: 12px solid transparent;
        border-image-source: url("assets/images/ui/court_info_frame.png");
        border-image-slice: 16;
        border-image-width: 12px;
        border-image-repeat: stretch;
        background: transparent;
        padding: 0.4rem;
        image-rendering: pixelated;
      }
      .action-panel.selected {
        outline: none;
        filter: drop-shadow(0 0 7px var(--focus-glow));
        box-shadow: inset 0 0 0 1px var(--focus-line);
      }
      /* 모서리가 잘린 프레임 이미지를 9-slice로 늘려 버튼 테두리로 사용 */
      .action-btn {
        display: flex;
        align-items: center;
        gap: 0.55rem;
        border: 10px solid transparent;
        position: relative;
        border-image-source: url("assets/images/ui/btn_frame_fill.png");
        border-image-slice: 10 fill;
        border-image-width: 10px;
        border-image-repeat: stretch;
        background: transparent;
        padding: 0.35rem 0.5rem;
        min-height: 3rem;
        flex: 0 0 auto;
        image-rendering: pixelated;
      }
      .action-btn .action-icon {
        width: 1.55rem;
        height: 1.55rem;
        flex: 0 0 auto;
        object-fit: contain;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .action-btn .action-copy {
        min-width: 0;
        flex: 1 1 auto;
      }
      .action-btn .sub {
        display: block;
        margin-top: 0.18rem;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .action-btn.selected {
        outline: none;
        filter: drop-shadow(0 0 7px var(--focus-glow));
        color: var(--focus);
      }
      /* 프레임 채움이 배경 위에 그려지므로 강조는 오버레이로 얹는다 */
      .action-btn.selected::after {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--focus-fill);
        pointer-events: none;
      }
      .action-btn.selected .sub {
        color: rgba(240, 193, 75, 0.78);
      }
      .event-row, .record-row {
        padding: 0.55rem 0.65rem;
        border-bottom: 1px solid rgba(255,255,255,0.16);
        cursor: pointer;
      }
      .event-row.current {
        background: rgba(255,255,255,0.045);
      }
      .event-row.selected {
        outline: 1px solid var(--focus);
        outline-offset: -1px;
        background: var(--focus-fill);
      }
      .event-head {
        display: flex;
        align-items: flex-start;
        gap: 0.45rem;
      }
      .event-cursor {
        width: 1rem;
        color: #fff;
        flex-shrink: 0;
      }
      .event-badge {
        display: inline-block;
        margin-left: 0.45rem;
        color: #fff;
        font-size: 0.72rem;
      }
      .event-title { line-height: 1.35; }
      .event-meta, .record-meta {
        color: var(--muted);
        font-size: 0.78rem;
        margin-top: 0.2rem;
      }
      .court-frame {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 0;
        border: 4px solid transparent;
        border-image-source: url("assets/images/ui/court_stage_frame.png");
        border-image-slice: 2;
        border-image-width: 4px;
        border-image-repeat: stretch;
        background-color: rgba(0,0,0,0.48);
        background-image: var(--stage-art, none);
        background-position: center 12%;
        background-size: cover;
        background-repeat: no-repeat;
        background-clip: padding-box;
        position: relative;
        overflow: hidden;
        image-rendering: pixelated;
      }
      .court-soul {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: var(--soul-sprite, url("assets/images/ui/soul_ghost.png"));
        background-position: center 48%;
        background-size: auto 50%;
        background-repeat: no-repeat;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .court-frame-cover {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-image: var(--stage-art-cover, none);
        background-position: center 12%;
        background-size: cover;
        background-repeat: no-repeat;
        background-color: transparent;
        pointer-events: none;
        image-rendering: pixelated;
      }
      .player-bubble,
      .soul-bubble {
        position: absolute;
        z-index: 2;
        width: min(520px, 72%);
        border: 1px solid rgba(255,255,255,0.76);
        background: rgba(0,0,0,0.86);
        padding: 0.85rem 1rem;
        line-height: 1.55;
        color: var(--text);
        opacity: 0;
        pointer-events: none;
        white-space: pre-wrap;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.55), 0 18px 42px rgba(0,0,0,0.42);
      }
      .player-bubble {
        left: 8%;
        bottom: 1.5rem;
        transform: translate(-12px, 8px);
        width: min(420px, 58%);
      }
      .soul-bubble {
        left: 50%;
        top: 16%;
        transform: translate(-50%, 12px);
        max-height: min(52%, 24rem);
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(242,242,242,0.72) rgba(0,0,0,0.35);
      }
      .soul-bubble.awaiting {
        padding-bottom: 1.7rem;
        outline: none;
        filter: drop-shadow(0 0 8px var(--focus-glow));
        box-shadow:
          0 0 0 1px var(--focus-line),
          0 0 0 1px rgba(0, 0, 0, 0.55),
          0 18px 42px rgba(0, 0, 0, 0.42);
        border-color: var(--focus);
      }
      .soul-bubble.awaiting::before {
        content: "Enter로 닫기";
        position: absolute;
        right: 0.8rem;
        bottom: 0.45rem;
        font-size: 0.72rem;
        letter-spacing: 0.04em;
        color: var(--focus);
        pointer-events: none;
      }
      .player-bubble::after,
      .soul-bubble::after {
        content: "";
        position: absolute;
        bottom: -9px;
        width: 16px;
        height: 16px;
        border-right: 1px solid rgba(255,255,255,0.76);
        border-bottom: 1px solid rgba(255,255,255,0.76);
        background: rgba(0,0,0,0.86);
      }
      .player-bubble::after {
        left: 24%;
        transform: rotate(45deg);
      }
      .soul-bubble::after {
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
      }
      .player-bubble.show {
        animation: playerQuestion 0.45s ease both;
        opacity: 1;
      }
      .soul-bubble.show {
        animation: bubbleReveal 0.45s ease both;
        opacity: 1;
      }
      .player-bubble.context,
      .soul-bubble.context {
        border-color: rgba(159,209,255,0.88);
      }
      .player-bubble.intent,
      .soul-bubble.intent {
        border-color: rgba(255,212,142,0.9);
      }
      .court-frame.pulse {
        animation: courtPulse 0.7s ease both;
      }
      .verdict-review {
        position: absolute;
        inset: 0;
        z-index: 6;
        display: flex;
        flex-direction: column;
        min-height: 0;
        background: rgba(6, 6, 6, 0.94);
      }
      .verdict-review[hidden] {
        display: none !important;
      }
      .verdict-review.selected {
        outline: none;
        filter: drop-shadow(0 0 7px var(--focus-glow));
        box-shadow: inset 0 0 0 1px var(--focus-line);
      }
      .verdict-review-body {
        flex: 1 1 auto;
        min-height: 0;
        overflow: auto;
        padding: 0.85rem 1rem 1.2rem;
        scrollbar-width: thin;
        scrollbar-color: rgba(226, 226, 226, 0.78) #0a0a0a;
      }
      .verdict-review-body::-webkit-scrollbar {
        width: 10px;
      }
      .verdict-review-body::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      .verdict-review-body::-webkit-scrollbar-thumb {
        background: #cfcfcf;
      }
      .verdict-review-block + .verdict-review-block {
        margin-top: 1.35rem;
        padding-top: 1.1rem;
        border-top: 1px solid rgba(255, 255, 255, 0.18);
      }
      .verdict-review-head {
        font-size: 1.05rem;
        letter-spacing: 0.06em;
        margin-bottom: 0.35rem;
      }
      .verdict-review-sub {
        color: var(--muted);
        margin-bottom: 0.55rem;
      }
      .verdict-review-label {
        color: var(--muted);
        letter-spacing: 0.06em;
        margin: 0.7rem 0 0.28rem;
      }
      .verdict-review-text {
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .verdict-review-locked {
        color: var(--muted);
      }
      .court-caption {
        min-height: 0;
        padding: 0.65rem 0.75rem;
        background: transparent;
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .court-caption .sub {
        color: var(--muted);
        margin-top: 0.45rem;
      }
      .record-box, .right-stack {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .record-shell {
        position: relative;
        align-self: stretch;
        flex: 0 0 50%;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .record-panel-frame {
        position: relative;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .record-panel-overlay {
        position: absolute;
        top: 1.9rem;
        right: 0;
        bottom: 0;
        left: 0;
        z-index: 2;
        display: flex;
        flex-direction: column;
        border: 8px solid transparent;
        border-image-source: url("assets/images/ui/record_underlay.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: stretch;
        background: transparent;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .record-panel-overlay[hidden] {
        display: none;
      }
      .record-panel-overlay-border {
        position: relative;
        flex: 1 1 auto;
        align-self: stretch;
        min-height: 0;
        margin: 0.45rem;
        box-sizing: border-box;
        border: 12px solid transparent;
        border-image-source: url("assets/images/ui/panel_frame.png");
        border-image-slice: 16 fill;
        border-image-width: 12px;
        border-image-repeat: stretch;
        image-rendering: pixelated;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .record-panel-overlay-grid {
        position: absolute;
        inset: 0.55rem;
        z-index: 0;
        background-image:
          repeating-linear-gradient(to right, #6d6d6f 0, #6d6d6f 1px, transparent 1px, transparent 24px),
          repeating-linear-gradient(to bottom, #6d6d6f 0, #6d6d6f 1px, transparent 1px, transparent 24px);
        pointer-events: none;
      }
      .record-panel-overlay-title {
        position: relative;
        z-index: 1;
        flex: 0 0 auto;
        align-self: stretch;
        margin: 0;
        padding: 0.45rem 0.75rem;
        border: 8px solid transparent;
        border-image-source: url("assets/images/ui/record_frame.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: stretch;
        color: #232323;
        font-size: 1.15rem;
        letter-spacing: 0.08em;
        text-align: center;
        image-rendering: pixelated;
      }
      .record-panel-wrap {
        position: relative;
        z-index: 1;
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: column;
        padding-top: 1.9rem;
      }
      .record-box {
        align-self: stretch;
        flex: 1 1 auto;
        height: auto;
        min-height: 0;
        border: 8px solid transparent;
        border-image-source: url("assets/images/ui/record_frame.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: stretch;
        background: transparent;
        image-rendering: pixelated;
      }
      .record-box > .panel-title,
      .record-box > .record-page {
        background: transparent;
      }
      .record-box > .record-page-top {
        flex: 0 0 1.6rem;
        min-height: 1.6rem;
        max-height: 1.6rem;
        padding: 0;
        overflow: hidden;
      }
      #emptyBox {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-color: #ffffff;
        background: #000000;
      }
      #emptyBox > * {
        position: relative;
        z-index: 1;
      }
      #emptyBox.selected {
        outline: none;
        filter: drop-shadow(0 0 7px var(--focus-glow));
        box-shadow: inset 0 0 0 1px var(--focus-line);
      }
      #emptyBox.selected::after {
        content: "";
        position: absolute;
        inset: 0;
        z-index: 0;
        background: rgba(0, 0, 0, 0.55);
        pointer-events: none;
      }
      #emptyBox.is-inactive {
        pointer-events: none;
      }
      #emptyBox.is-inactive > * {
        visibility: hidden;
      }
      #emptyTitleRow[hidden] {
        display: none;
      }
      #emptyCostTitle {
        color: var(--text);
        font-variant-numeric: tabular-nums;
        text-align: right;
        min-width: 0;
      }
      #emptyCostTitle[hidden] {
        display: none;
      }
      #emptyBox.is-events-only {
        justify-content: center;
      }
      #emptyBox.is-events-only .empty-mode-art {
        height: auto;
        max-height: none;
        flex: 1 1 auto;
        min-height: 0;
      }
      #emptyBox > #emptyPage.record-page {
        flex: 1 1 auto;
        min-height: 0;
        scrollbar-width: thin;
        scrollbar-color: rgba(226, 226, 226, 0.78) #0a0a0a;
      }
      #emptyPage::-webkit-scrollbar {
        width: 10px;
      }
      #emptyPage::-webkit-scrollbar-track {
        background:
          linear-gradient(to right, rgba(255,255,255,0.14) 0, rgba(255,255,255,0.14) 1px, transparent 1px),
          #0a0a0a;
        border-left: 1px solid rgba(255,255,255,0.22);
      }
      #emptyPage::-webkit-scrollbar-thumb {
        background: repeating-linear-gradient(
          to bottom,
          #cfcfcf 0,
          #cfcfcf 3px,
          #8f8f8f 3px,
          #8f8f8f 6px
        );
        border: 1px solid #1a1a1a;
        box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
      }
      #emptyPage::-webkit-scrollbar-thumb:hover {
        background: #f2f2f2;
      }
      #emptyPage::-webkit-scrollbar-corner {
        background: #0a0a0a;
      }
      .empty-event {
        white-space: pre-wrap;
        line-height: 1.55;
        padding-bottom: 0.9rem;
      }
      .empty-event:last-child {
        padding-bottom: 0;
      }
      .empty-mode-art {
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 50vh;
        max-height: 50%;
        padding: 0.35rem 0.35rem 0.15rem;
        box-sizing: border-box;
      }
      .empty-mode-art[hidden] {
        display: none;
      }
      .empty-mode-art img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        object-position: center;
        image-rendering: pixelated;
        pointer-events: none;
      }
      /* 노트 스프링: record-shell 상단에 절반 걸침 */
      .record-spring {
        position: absolute;
        z-index: 3;
        left: 0.75rem;
        right: 0.75rem;
        top: -0.42rem;
        height: 3.8rem;
        background-image: url("assets/images/ui/notes_spring.png");
        background-repeat: space no-repeat;
        background-position: top left;
        background-size: auto 100%;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .record-box > .panel-title {
        border: 8px solid transparent;
        border-image-source: url("assets/images/ui/notes_frame.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: stretch;
        background: transparent;
        image-rendering: pixelated;
      }
      .right-stack { gap: 0.65rem; }
      .record-list {
        white-space: pre-wrap;
        line-height: 1.55;
        overflow: auto;
      }
      .record-page {
        flex: 1;
        padding: 0.9rem 1rem;
        overflow: auto;
        white-space: pre-wrap;
        line-height: 1.55;
      }
      #recordPage.record-page {
        color: #000000;
        line-height: 1.55;
        background-image: repeating-linear-gradient(
          to bottom,
          transparent 0,
          transparent calc(1.55em - 1px),
          #7e7d7d calc(1.55em - 1px),
          #7e7d7d 1.55em
        );
        background-origin: content-box;
        background-clip: content-box;
        background-attachment: local;
      }
      .record-page-control {
        flex: 0 0 auto;
        align-self: stretch;
        display: flex;
        align-items: stretch;
        gap: 0.45rem;
        margin: 0.35rem 0.55rem 0.5rem;
      }
      .record-page-side {
        position: relative;
        flex: 0 0 auto;
        align-self: stretch;
        width: auto;
        aspect-ratio: 24 / 32;
        display: grid;
        place-items: center;
        cursor: pointer;
      }
      .record-page-decoration {
        width: 100%;
        height: 100%;
        object-fit: fill;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .record-page-chevron {
        position: absolute;
        inset: 0;
        margin: auto;
        width: 45%;
        height: 45%;
        object-fit: contain;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .record-page-side.is-right .record-page-chevron {
        transform: scaleX(-1);
      }
      .record-page-info {
        flex: 1 1 auto;
        min-width: 0;
        margin: 0;
        padding: 0.15rem 0.4rem;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 8px solid transparent;
        border-image-source: url("assets/images/ui/page_frame.png");
        border-image-slice: 8 fill;
        border-image-width: 8px;
        border-image-repeat: stretch;
        text-align: center;
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        image-rendering: pixelated;
      }
      .record-page-count {
        color: var(--muted);
        font-size: 0.82rem;
        letter-spacing: 0.08em;
        flex: 0 0 auto;
      }
      #recordTitle {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .record-box.selected {
        outline: none;
        background-color: var(--focus-fill);
        filter: drop-shadow(0 0 6px var(--focus-glow));
      }
      .record-box.updated {
        animation: recordUpdated 0.9s ease both;
      }
      .record-empty { color: var(--muted); padding: 0.75rem; }
      .court-column {
        position: relative;
        overflow: hidden;
      }
      .court-bottom {
        flex: 0 0 auto;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.45rem;
        border: 12px solid transparent;
        border-image-source: url("assets/images/ui/court_info_frame.png");
        border-image-slice: 16;
        border-image-width: 12px;
        border-image-repeat: stretch;
        background: transparent;
        padding: 0.35rem;
        image-rendering: pixelated;
      }
      .court-info-btn {
        position: relative;
        width: 100%;
        min-height: 4.5rem;
        border: 10px solid transparent;
        border-image-source: url("assets/images/ui/btn_frame_fill.png");
        border-image-slice: 10 fill;
        border-image-width: 10px;
        border-image-repeat: stretch;
        background: transparent;
        color: var(--text);
        padding: 0.35rem 0.55rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.55rem;
        text-align: left;
        image-rendering: pixelated;
      }
      .court-info-btn-main {
        display: inline-flex;
        align-items: center;
        gap: 0.45rem;
        min-width: 0;
      }
      .court-info-btn-icon {
        width: 1.55rem;
        height: 1.55rem;
        flex: 0 0 auto;
        object-fit: contain;
        image-rendering: pixelated;
        pointer-events: none;
      }
      .court-info-btn::after {
        content: "▲";
        color: var(--muted);
        transition: transform 180ms ease;
      }
      .court-info-btn[aria-expanded="true"]::after {
        transform: rotate(180deg);
      }
      .court-info-btn.selected {
        outline: none;
        filter: drop-shadow(0 0 7px var(--focus-glow));
        color: var(--focus);
      }
      /* ::after는 화살표라 강조 오버레이는 ::before로 얹는다 */
      .court-info-btn.selected::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--focus-fill);
        pointer-events: none;
      }
      .court-info-drawer {
        position: absolute;
        z-index: 5;
        left: 0;
        right: 0;
        bottom: 4.85rem;
        max-height: min(58%, 28rem);
        display: block;
        padding: 0.65rem;
        overflow: auto;
        border: 1px solid var(--line);
        background: rgba(0, 0, 0, 0.96);
        box-shadow: 0 -0.7rem 1.5rem rgba(0, 0, 0, 0.75);
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: translateY(calc(100% + 4.5rem));
        transition: transform 220ms ease, opacity 180ms ease, visibility 220ms;
      }
      .court-info-drawer.open {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
        transform: translateY(0);
      }
      .court-info-drawer .panel {
        min-height: 9rem;
        overflow: auto;
      }
      .court-info-drawer .panel[hidden] {
        display: none;
      }
      .mini-list {
        white-space: pre-wrap;
        line-height: 1.45;
        max-height: 10.5rem;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(242,242,242,0.72) rgba(0,0,0,0.35);
      }
      .mini-list::-webkit-scrollbar {
        width: 8px;
      }
      .mini-list::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.35);
        border-left: 1px solid rgba(255,255,255,0.16);
      }
      .mini-list::-webkit-scrollbar-thumb {
        background: rgba(242,242,242,0.72);
        border: 1px solid rgba(0,0,0,0.6);
      }
      .mini-list::-webkit-scrollbar-thumb:hover {
        background: #fff;
      }
      .scroll-focus.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .hint {
        display: flex;
        flex-direction: column;
        gap: 0.25rem;
        margin-top: auto;
        padding: 0.55rem 0.7rem;
        background: #0a0a0a;
        color: #ffffff;
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .hint span {
        display: block;
      }
      .hint b {
        font-weight: 700;
        color: #ffffff;
      }

      .verdict-warn {
        color: var(--muted);
        line-height: 1.45;
        margin-bottom: 0.8rem;
        white-space: pre-wrap;
      }
      .verdict-choices {
        display: flex;
        gap: 0.7rem;
        margin-bottom: 0.8rem;
      }
      .verdict-choice { flex: 1; text-align: center; }
      .verdict-choice.hell.selected { color: #ffb4b4; border-color: var(--hell); }
      .verdict-choice.heaven.selected { color: var(--heaven); border-color: var(--heaven); }
      #verdictReason {
        width: 100%;
        min-height: 5rem;
        resize: vertical;
        background: #111;
        border: 1px solid var(--line);
        padding: 0.7rem;
      }
      .verdict-submit {
        margin-top: 0.8rem;
        width: 100%;
        text-align: center;
      }
      .modal-layer {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.58);
        z-index: 40;
      }
      .modal-layer.active { display: flex; }
      .menu-popup {
        width: min(360px, 88vw);
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.9);
        padding: 1rem;
      }
      .menu-popup-title {
        margin-bottom: 0.8rem;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .popup-menu {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .popup-item {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 0.78rem 1rem;
        text-align: left;
      }
      .confirm-text {
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 0.9rem;
        white-space: pre-wrap;
      }
      #verdictConfirmModal .menu-popup {
        border-color: #ffffff;
      }
      #verdictConfirmModal .menu-popup-title,
      #verdictConfirmModal .confirm-text,
      #verdictConfirmModal .popup-item {
        color: #ffffff;
      }
      #verdictConfirmModal .popup-item {
        border-color: #ffffff;
      }

      #screen-end {
        justify-content: stretch;
        align-items: stretch;
        background: #050505 center / cover no-repeat;
        padding: 0;
      }
      .end-layout {
        flex: 1;
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        min-height: 0;
        padding: clamp(1.4rem, 4.5vh, 3rem) clamp(1.6rem, 5vw, 4.2rem);
      }
      #screen-end.is-heaven .end-layout {
        color: #fff8e8;
        background: linear-gradient(180deg, rgba(18, 14, 8, 0.46) 0%, transparent 28%, transparent 58%, rgba(10, 8, 4, 0.74) 100%);
      }
      #screen-end.is-hell .end-layout {
        color: #ffe8d4;
        background: linear-gradient(180deg, rgba(0, 0, 0, 0.56) 0%, transparent 30%, transparent 56%, rgba(0, 0, 0, 0.84) 100%);
      }
      .end-header {
        max-width: 28rem;
      }
      .end-kicker {
        margin: 0 0 0.35rem;
        letter-spacing: 0.28em;
        font-size: 0.82rem;
        opacity: 0.82;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      }
      #endTitle {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 4.2rem);
        letter-spacing: 0.18em;
        font-weight: 700;
        line-height: 1.1;
        text-shadow: 0 2px 18px rgba(0, 0, 0, 0.85);
      }
      .end-copy {
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1.5rem 2.5rem;
      }
      .end-main {
        max-width: 34rem;
        min-width: 0;
      }
      .end-lead {
        margin: 0 0 0.45rem;
        font-size: 1.12rem;
        line-height: 1.55;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      }
      .end-time {
        margin: 0;
        opacity: 0.88;
        letter-spacing: 0.04em;
        text-shadow: 0 1px 10px rgba(0, 0, 0, 0.8);
      }
      .end-footer {
        width: min(22rem, 100%);
        flex-shrink: 0;
      }
      #screen-end .end-menu-item {
        text-align: center;
        background: rgba(0, 0, 0, 0.62);
      }
      @media (max-width: 720px) {
        .end-copy {
          flex-direction: column;
          align-items: stretch;
        }
        .end-footer {
          width: 100%;
        }
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.88);
        border: 1px solid var(--line);
        padding: 0.65rem 1rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 50;
        max-width: 90vw;
      }
      #toast.show { opacity: 1; }

      @keyframes bubbleReveal {
        0% { opacity: 0; transform: translate(-50%, 16px) scale(0.98); }
        100% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      }
      @keyframes playerQuestion {
        0% { opacity: 0; transform: translate(-12px, 12px) scale(0.98); }
        100% { opacity: 1; transform: translate(0, 0) scale(1); }
      }
      @keyframes courtPulse {
        0% { box-shadow: inset 0 0 0 rgba(240, 193, 75, 0); }
        35% { box-shadow: inset 0 0 38px var(--focus-fill); }
        100% { box-shadow: inset 0 0 0 rgba(240, 193, 75, 0); }
      }
      @keyframes recordUpdated {
        0% { box-shadow: 0 0 0 rgba(240, 193, 75, 0); }
        35% { box-shadow: 0 0 0 2px var(--focus), 0 0 28px var(--focus-glow); }
        100% { box-shadow: 0 0 0 rgba(240, 193, 75, 0); }
      }

      @media (max-width: 980px) {
        html, body { overflow: auto; }
        .screen { min-height: 100%; position: relative; }
        .trial-shell {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto minmax(260px, 48vh);
          overflow: visible;
        }
        .record-box {
          height: auto;
          align-self: stretch;
        }
        .court-frame { min-height: 340px; }
        .court-info-drawer {
          max-height: 70%;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">지옥법정</h1>

    <section id="screen-title" class="screen active" aria-label="타이틀">
      <nav class="title-menu" id="titleMenu" aria-label="타이틀 메뉴"></nav>
    </section>

    <section id="screen-settings" class="screen" aria-label="설정">
      <div class="settings-card">
        <h1>설정</h1>
        <nav class="settings-menu" id="settingsMenu" aria-label="설정 메뉴"></nav>
      </div>
    </section>

    <section id="screen-lobby" class="screen" aria-label="로비">
      <div class="lobby-card">
        <h1>염라의 법정 · 로비</h1>
        <div class="lobby-meta" id="lobbyMeta"></div>
        <div class="lobby-summary" id="lobbySummary"></div>
        <div class="lobby-actions" id="lobbyActions"></div>
      </div>
    </section>

    <section id="screen-ingame" class="screen" aria-label="재판">
      <div class="ingame-backdrop">
      <div class="trial-shell">
        <aside class="col right-stack" aria-label="ACTION">
          <div class="panel panel-court-name" aria-label="염라의 법정">
            <div class="panel-body hud" id="courtMeta">염라의 법정</div>
          </div>

          <div class="panel panel-action-spacer" aria-label="법정 대사">
            <div class="court-caption">
              <div id="courtMain">망자가 법정에 섰다.</div>
              <div class="sub" id="courtSub"></div>
            </div>
          </div>

          <div class="action-panel" id="actionPanel" aria-label="행동 메뉴">
            <button type="button" class="action-btn" id="eventsBtn">
              <img class="action-icon" src="assets/images/ui/icon_events.png" alt="" aria-hidden="true">
              <span class="action-copy">
                인생사건
                <span class="sub" id="eventsSub">망자의 생애 기록을 열람합니다.</span>
              </span>
            </button>

            <button type="button" class="action-btn" id="interrogateBtn">
              <img class="action-icon" src="assets/images/ui/icon_interrogate.png" alt="" aria-hidden="true">
              <span class="action-copy">
                심문하기
                <span class="sub" id="interrogateSub">심문할 사건을 선택합니다</span>
              </span>
            </button>

            <div class="action-list" id="actionList"></div>
          </div>
          <div class="hint">
            <span><b>Tab</b> 영역 이동 · <b>Shift+Tab</b> 역순</span>
            <span><b>방향키</b> 항목 이동 · <b>Enter</b> 선택</span>
            <span><b>1</b> 인생사건 · <b>Space</b> 심문 · <b>V</b> 판결</span>
            <span><b>Esc</b> 닫기 / 취소</span>
          </div>
          <div class="panel panel-court-time">
            <div class="panel-title">
              <span class="panel-title-label">
                <img class="panel-title-icon" src="assets/images/ui/icon_court_time.png" alt="" aria-hidden="true">
                <span>법정시간</span>
              </span>
              <span id="timeValue">0:00</span>
            </div>
            <div class="panel-body hud">
              <div class="hud-row">
                <div class="seg-track" id="timeSegs"></div>
              </div>
            </div>
          </div>
        </aside>

        <main class="col court-column" aria-label="COURT">
          <div class="panel panel-trial-subject">
            <div class="panel-body" id="trialSubject">재판 중: -</div>
          </div>
          <div class="court-frame" id="courtFrame">
            <div class="court-soul" id="courtSoul" aria-hidden="true"></div>
            <div class="court-frame-cover" id="courtFrameCover" aria-hidden="true"></div>
            <div class="player-bubble" id="playerBubble"></div>
            <div class="soul-bubble" id="soulBubble"></div>
            <section class="verdict-review" id="verdictReview" hidden aria-label="판결 검토">
              <div class="panel-title panel-title-row">
                <span id="verdictReviewTitle">사건 기록</span>
              </div>
              <div class="verdict-review-body" id="verdictReviewBody"></div>
            </section>
          </div>
          <div class="court-info-drawer" id="courtInfoDrawer" aria-hidden="true">
            <section class="panel" id="todayPanel" aria-label="금일 망자 상세정보" hidden>
              <div class="panel-title panel-title-row">
                <span>금일 망자</span>
                <span id="remainingValue">남은 망자 0명</span>
              </div>
              <div class="panel-body mini-list" id="todayList"></div>
            </section>
            <section class="panel" id="profilePanel" aria-label="망자 프로필 상세정보" hidden>
              <div class="panel-title">망자 프로필</div>
              <div class="panel-body mini-list scroll-focus" id="profileBox"></div>
            </section>
          </div>
          <div class="court-bottom">
            <button type="button" class="court-info-btn" id="todayInfoBtn" aria-controls="courtInfoDrawer" aria-expanded="false">
              <span class="court-info-btn-main">
                <img class="court-info-btn-icon" src="assets/images/ui/icon_record.png" alt="" aria-hidden="true">
                <span>금일 망자</span>
              </span>
            </button>
            <button type="button" class="court-info-btn" id="profileInfoBtn" aria-controls="courtInfoDrawer" aria-expanded="false">
              <span class="court-info-btn-main">
                <img class="court-info-btn-icon" src="assets/images/ui/icon_profile.png" alt="" aria-hidden="true">
                <span>망자 프로필</span>
              </span>
            </button>
          </div>
        </main>

        <aside class="col" aria-label="RIGHT SIDE">
          <section class="panel" id="emptyBox" style="flex:1;min-height:0" aria-label="심문 선택">
            <div class="panel-title panel-title-row" id="emptyTitleRow">
              <span id="emptyTitle">EMPTY</span>
              <span id="emptyCostTitle" hidden></span>
            </div>
            <div class="empty-mode-art" id="emptyEventsArt" hidden>
              <img src="assets/images/ui/events_notes.png" alt="" aria-hidden="true">
            </div>
            <div class="empty-mode-art" id="emptyInterrogateArt" hidden>
              <img src="assets/images/ui/interrogate_mic.png" alt="" aria-hidden="true">
            </div>
            <div class="empty-mode-art" id="emptyVerdictArt" hidden>
              <img src="assets/images/ui/verdict_gavel.png" alt="" aria-hidden="true">
            </div>
            <div class="empty-mode-art" id="emptyMenuArt" hidden>
              <img src="assets/images/ui/menu_door.png" alt="" aria-hidden="true">
            </div>
            <div class="record-page" id="emptyPage"></div>
          </section>
          <div class="record-shell">
            <div class="record-spring" aria-hidden="true"></div>
            <div class="record-panel-frame">
              <div class="record-panel-overlay" aria-hidden="true">
                <div class="record-panel-overlay-border">
                  <div class="record-panel-overlay-grid" aria-hidden="true"></div>
                  <div class="record-panel-overlay-title">인생 사건 기록</div>
                </div>
              </div>
              <div class="record-panel-wrap">
                <section class="panel record-box" id="recordBox" aria-label="사건 기록">
                  <div class="record-page record-page-top" id="recordTopPage" aria-hidden="true"></div>
                  <div class="panel-title panel-title-row">
                    <span id="recordTitle">사건 기록</span>
                    <span class="record-page-count" id="recordPageCount">0/0</span>
                  </div>
                  <div class="record-page" id="recordPage"></div>
                  <div class="record-page-control">
                    <div class="record-page-side is-left" aria-hidden="true">
                      <img class="record-page-decoration" src="assets/images/ui/page_left.png" alt="">
                      <img class="record-page-chevron" src="assets/images/ui/page_chevron.png" alt="">
                    </div>
                    <div class="record-page-info" id="recordPageInfo">PAGE 0</div>
                    <div class="record-page-side is-right" aria-hidden="true">
                      <img class="record-page-decoration" src="assets/images/ui/page_right.png" alt="">
                      <img class="record-page-chevron" src="assets/images/ui/page_chevron.png" alt="">
                    </div>
                  </div>
                </section>
              </div>

    <section id="screen-verdict" class="screen" aria-label="판결">
      <div class="verdict-card">
        <h2>판결</h2>
        <div class="verdict-warn" id="verdictWarn"></div>
        <div class="verdict-choices">
          <button type="button" class="verdict-choice hell" data-choice="hell">지옥</button>
          <button type="button" class="verdict-choice heaven" data-choice="heaven">천국</button>
        </div>
        <label class="sr-only" for="verdictReason">판결 이유</label>
        <textarea id="verdictReason" placeholder="판결 이유를 적을 수 있습니다 (선택)"></textarea>
        <button type="button" class="verdict-submit" id="verdictSubmit">판결 확정</button>

        <div class="verdict-choices">
          <button type="button" class="verdict-choice heaven" data-expedite="heaven">무죄</button>
          <button type="button" class="verdict-choice hell" data-expedite="hell">유죄</button>

    <section id="screen-end" class="screen" aria-label="판결 결과">

        <header class="end-header">
          <p class="end-kicker">판결</p>
          <h2 id="endTitle"></h2>
        </header>
        <div class="end-copy">
          <main class="end-main">
            <p id="endLead" class="end-lead"></p>
            <p id="endSub" class="end-time"></p>

            <nav class="end-menu" id="endMenu" aria-label="판결 후 메뉴"></nav>
          </footer>
