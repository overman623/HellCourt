<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지옥법정</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #050505;
        --panel: rgba(0, 0, 0, 0.74);
        --panel-soft: rgba(20, 20, 20, 0.88);
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.58);
        --line: rgba(242, 242, 242, 0.56);
        --focus: #ffffff;
        --hell: #c62828;
        --heaven: #9fd1ff;
      }

      @font-face {
        font-family: "GameUI";
        src: url("assets/fonts/PF_start_dust_3.0_ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font-family: "GameUI", "Malgun Gothic", sans-serif;
      }
      button, textarea { font: inherit; color: inherit; }
      button { background: none; border: none; cursor: pointer; padding: 0; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .screen {
        position: absolute; inset: 0; display: none;
        flex-direction: column; align-items: center; justify-content: center;
      }
      .screen.active { display: flex; }
      .panel {
        border: 1px solid var(--line);
        background: var(--panel);
      }
      .panel-title {
        padding: 0.55rem 0.7rem;
        border-bottom: 1px solid rgba(255,255,255,0.28);
        color: var(--muted);
        font-size: 0.85rem;
        letter-spacing: 0.08em;
      }
      .panel-title-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 0.75rem;
      }
      .panel-body { padding: 0.75rem; }

      #screen-title {
        justify-content: flex-end;
        padding-bottom: clamp(4rem, 12vh, 7rem);
        background: var(--title-bg, #050505) center / cover no-repeat;
        image-rendering: pixelated;
      }
      .title-menu, .settings-menu, .end-menu {
        display: flex;
        flex-direction: column;
        gap: 0.8rem;
        align-items: stretch;
      }
      .title-item, .settings-item, .end-menu-item, .lobby-btn, .action-btn, .verdict-choice, .verdict-submit {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 0.72rem 1rem;
        text-align: left;
        min-height: 2.6rem;
      }
      .title-item { min-width: 14rem; text-align: center; }
      .selected, .title-item.selected, .settings-item.selected, .end-menu-item.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      button:disabled {
        opacity: 0.38;
        cursor: default;
      }

      #screen-settings, #screen-lobby, #screen-verdict, #screen-expedite {
        background: #050505;
        padding: 2rem;
      }
      .settings-card, .lobby-card, .verdict-card, .expedite-card {
        width: min(860px, 94vw);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 1.25rem;
      }
      .settings-card h1, .lobby-card h1, .verdict-card h2, .expedite-card h2 {
        margin: 0 0 1rem;
        font-size: 1.35rem;
        letter-spacing: 0.08em;
      }
      .expedite-body {
        white-space: pre-wrap;
        line-height: 1.55;
        min-height: 8rem;
        margin-bottom: 1rem;
        color: var(--muted);
      }
      .lobby-meta, .lobby-summary {
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .lobby-meta { color: var(--muted); margin-bottom: 0.8rem; }
      .lobby-summary {
        min-height: 8rem;
        border: 1px solid rgba(255,255,255,0.2);
        padding: 0.9rem;
        margin-bottom: 1rem;
      }
      .lobby-actions {
        display: flex;
        gap: 0.65rem;
        flex-wrap: wrap;
      }
      .lobby-btn.primary { border-color: var(--heaven); color: var(--heaven); }

      #screen-ingame {
        align-items: stretch;
        justify-content: stretch;
        background: var(--ingame-bg, #050505) center / cover no-repeat;
      }
      .trial-shell {
        flex: 1;
        display: grid;
        grid-template-columns: minmax(240px, 24%) minmax(400px, 46%) minmax(300px, 30%);
        grid-template-rows: minmax(0, 1fr);
        gap: 0.75rem;
        padding: 0.9rem;
        width: 100%;
        max-width: 1700px;
        margin: 0 auto;
        min-height: 0;
      }
      .col {
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .hud {
        display: grid;
        gap: 0.5rem;
      }
      .hud-row {
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      .hud-label { color: var(--muted); min-width: 4.5rem; }
      .seg-track {
        flex: 1;
        display: flex;
        gap: 4px;
      }
      .seg {
        flex: 1;
        height: 10px;
        border: 1px solid rgba(255,255,255,0.22);
        background: rgba(255,255,255,0.1);
      }
      .seg.on {
        border-color: #fff;
        background: #e8e8e8;
      }
      .hud-value { min-width: 4.5rem; text-align: right; }
      .action-list, .event-list, .record-list {
        overflow: auto;
        min-height: 0;
      }
      .action-list { display: flex; flex-direction: column; gap: 0.45rem; }
      .action-btn .sub {
        display: block;
        margin-top: 0.18rem;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }
      .action-btn.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
        background: rgba(255,255,255,0.08);
      }
      .event-row, .record-row {
        padding: 0.55rem 0.65rem;
        border-bottom: 1px solid rgba(255,255,255,0.16);
        cursor: pointer;
      }
      .event-row.current {
        background: rgba(255,255,255,0.045);
      }
      .event-row.selected {
        outline: 1px solid #fff;
        outline-offset: -1px;
        background: rgba(255,255,255,0.07);
      }
      .event-head {
        display: flex;
        align-items: flex-start;
        gap: 0.45rem;
      }
      .event-cursor {
        width: 1rem;
        color: #fff;
        flex-shrink: 0;
      }
      .event-badge {
        display: inline-block;
        margin-left: 0.45rem;
        color: #fff;
        font-size: 0.72rem;
      }
      .event-title { line-height: 1.35; }
      .event-meta, .record-meta {
        color: var(--muted);
        font-size: 0.78rem;
        margin-top: 0.2rem;
      }
      .court-frame {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        min-height: 0;
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.48);
        background-image: var(--stage-art, none);
        background-position: center top;
        background-size: cover;
        background-repeat: no-repeat;
        position: relative;
        overflow: hidden;
      }
      .player-bubble,
      .soul-bubble {
        position: absolute;
        width: min(520px, 72%);
        border: 1px solid rgba(255,255,255,0.76);
        background: rgba(0,0,0,0.86);
        padding: 0.85rem 1rem;
        line-height: 1.55;
        color: var(--text);
        opacity: 0;
        pointer-events: none;
        white-space: pre-wrap;
        box-shadow: 0 0 0 1px rgba(0,0,0,0.55), 0 18px 42px rgba(0,0,0,0.42);
      }
      .player-bubble {
        left: 8%;
        bottom: 9.2rem;
        transform: translate(-12px, 8px);
        width: min(420px, 58%);
      }
      .soul-bubble {
        left: 50%;
        top: 16%;
        transform: translate(-50%, 12px);
      }
      .player-bubble::after,
      .soul-bubble::after {
        content: "";
        position: absolute;
        bottom: -9px;
        width: 16px;
        height: 16px;
        border-right: 1px solid rgba(255,255,255,0.76);
        border-bottom: 1px solid rgba(255,255,255,0.76);
        background: rgba(0,0,0,0.86);
      }
      .player-bubble::after {
        left: 24%;
        transform: rotate(45deg);
      }
      .soul-bubble::after {
        left: 50%;
        transform: translateX(-50%) rotate(45deg);
      }
      .player-bubble.show {
        animation: playerQuestion 1.55s ease both;
      }
      .soul-bubble.show {
        animation: bubbleReveal 3.6s ease both;
      }
      .player-bubble.context,
      .soul-bubble.context {
        border-color: rgba(159,209,255,0.88);
      }
      .player-bubble.intent,
      .soul-bubble.intent {
        border-color: rgba(255,212,142,0.9);
      }
      .court-frame.pulse {
        animation: courtPulse 0.7s ease both;
      }
      .court-caption {
        min-height: 8rem;
        padding: 1rem;
        background: linear-gradient(transparent, rgba(0,0,0,0.9) 30%);
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .court-caption .sub {
        color: var(--muted);
        margin-top: 0.45rem;
      }
      .record-box, .right-stack {
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
      .record-box {
        align-self: stretch;
        flex: 0 0 50%;
        height: auto;
        min-height: 0;
      }
      .right-stack { gap: 0.65rem; }
      .record-list {
        white-space: pre-wrap;
        line-height: 1.55;
        overflow: auto;
      }
      .record-pager {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.55rem 0.75rem;
        border-bottom: 1px solid rgba(255,255,255,0.2);
        color: var(--muted);
        font-size: 0.82rem;
      }
      .record-page {
        flex: 1;
        padding: 0.9rem 1rem;
        overflow: auto;
        white-space: pre-wrap;
        line-height: 1.55;
      }
      .record-box.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .record-box.updated {
        animation: recordUpdated 0.9s ease both;
      }
      .record-empty { color: var(--muted); padding: 0.75rem; }
      .court-bottom {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.65rem;
      }
      .court-bottom .panel {
        min-height: 9rem;
        max-height: 13rem;
        overflow: auto;
      }
      .mini-list {
        white-space: pre-wrap;
        line-height: 1.45;
        max-height: 10.5rem;
        overflow: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(242,242,242,0.72) rgba(0,0,0,0.35);
      }
      .mini-list::-webkit-scrollbar {
        width: 8px;
      }
      .mini-list::-webkit-scrollbar-track {
        background: rgba(0,0,0,0.35);
        border-left: 1px solid rgba(255,255,255,0.16);
      }
      .mini-list::-webkit-scrollbar-thumb {
        background: rgba(242,242,242,0.72);
        border: 1px solid rgba(0,0,0,0.6);
      }
      .mini-list::-webkit-scrollbar-thumb:hover {
        background: #fff;
      }
      .scroll-focus.selected {
        outline: 2px solid var(--focus);
        outline-offset: -2px;
      }
      .hint {
        display: flex;
        justify-content: space-between;
        gap: 1rem;
        color: var(--muted);
        font-size: 0.78rem;
        line-height: 1.35;
      }

      .verdict-warn {
        color: var(--muted);
        line-height: 1.45;
        margin-bottom: 0.8rem;
        white-space: pre-wrap;
      }
      .verdict-choices {
        display: flex;
        gap: 0.7rem;
        margin-bottom: 0.8rem;
      }
      .verdict-choice { flex: 1; text-align: center; }
      .verdict-choice.hell.selected { color: #ffb4b4; border-color: var(--hell); }
      .verdict-choice.heaven.selected { color: var(--heaven); border-color: var(--heaven); }
      #verdictReason {
        width: 100%;
        min-height: 5rem;
        resize: vertical;
        background: #111;
        border: 1px solid var(--line);
        padding: 0.7rem;
      }
      .verdict-submit {
        margin-top: 0.8rem;
        width: 100%;
        text-align: center;
      }
      .modal-layer {
        position: fixed;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0,0,0,0.58);
        z-index: 40;
      }
      .modal-layer.active { display: flex; }
      .menu-popup {
        width: min(360px, 88vw);
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.9);
        padding: 1rem;
      }
      .menu-popup-title {
        margin-bottom: 0.8rem;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .popup-menu {
        display: flex;
        flex-direction: column;
        gap: 0.6rem;
      }
      .popup-item {
        border: 1px solid var(--line);
        background: var(--panel-soft);
        padding: 0.78rem 1rem;
        text-align: left;
      }
      .confirm-text {
        color: var(--muted);
        line-height: 1.55;
        margin-bottom: 0.9rem;
        white-space: pre-wrap;
      }

      #screen-end {
        justify-content: flex-end;
        align-items: center;
        background: #050505 center / cover no-repeat;
        padding-bottom: clamp(3rem, 10vh, 5.5rem);
      }
      .end-overlay {
        min-width: min(420px, 90vw);
        border: 1px solid var(--line);
        background: rgba(0,0,0,0.62);
        padding: 1.4rem;
        text-align: center;
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: 1.5rem;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.88);
        border: 1px solid var(--line);
        padding: 0.65rem 1rem;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        z-index: 50;
        max-width: 90vw;
      }
      #toast.show { opacity: 1; }

      @keyframes bubbleReveal {
        0% { opacity: 0; transform: translate(-50%, 16px) scale(0.98); }
        12% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        82% { opacity: 1; transform: translate(-50%, 0) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -8px) scale(0.99); }
      }
      @keyframes playerQuestion {
        0% { opacity: 0; transform: translate(-12px, 12px) scale(0.98); }
        16% { opacity: 1; transform: translate(0, 0) scale(1); }
        78% { opacity: 1; transform: translate(0, 0) scale(1); }
        100% { opacity: 0; transform: translate(8px, -4px) scale(0.99); }
      }
      @keyframes courtPulse {
        0% { box-shadow: inset 0 0 0 rgba(255,255,255,0); }
        35% { box-shadow: inset 0 0 38px rgba(255,255,255,0.22); }
        100% { box-shadow: inset 0 0 0 rgba(255,255,255,0); }
      }
      @keyframes recordUpdated {
        0% { box-shadow: 0 0 0 rgba(255,255,255,0); }
        35% { box-shadow: 0 0 0 2px rgba(255,255,255,0.9), 0 0 28px rgba(159,209,255,0.28); }
        100% { box-shadow: 0 0 0 rgba(255,255,255,0); }
      }

      @media (max-width: 980px) {
        html, body { overflow: auto; }
        .screen { min-height: 100%; position: relative; }
        .trial-shell {
          grid-template-columns: 1fr;
          grid-template-rows: auto auto minmax(260px, 48vh);
          overflow: visible;
        }
        .record-box {
          height: auto;
          align-self: stretch;
        }
        .court-frame { min-height: 340px; }
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">지옥법정</h1>

    <section id="screen-title" class="screen active" aria-label="타이틀">
      <nav class="title-menu" id="titleMenu" aria-label="타이틀 메뉴"></nav>
    </section>

    <section id="screen-settings" class="screen" aria-label="설정">
      <div class="settings-card">
        <h1>설정</h1>
        <nav class="settings-menu" id="settingsMenu" aria-label="설정 메뉴"></nav>
      </div>
    </section>

    <section id="screen-lobby" class="screen" aria-label="로비">
      <div class="lobby-card">
        <h1>공정의 법정 · 로비</h1>
        <div class="lobby-meta" id="lobbyMeta"></div>
        <div class="lobby-summary" id="lobbySummary"></div>
        <div class="lobby-actions" id="lobbyActions"></div>
      </div>
    </section>

    <section id="screen-ingame" class="screen" aria-label="재판">
      <div class="trial-shell">
        <aside class="col right-stack" aria-label="ACTION">
          <div class="panel">
            <div class="panel-title">법정</div>
            <div class="panel-body hud">
              <div id="courtMeta"></div>
            </div>
          </div>

          <div class="panel" style="min-height:6rem" aria-label="빈 레이아웃">
            <div class="panel-title">EMPTY</div>
          </div>

          <button type="button" class="action-btn" id="eventsBtn">
            인생사건
            <span class="sub" id="eventsSub">망자의 생애 기록을 열람합니다.</span>
          </button>

          <button type="button" class="action-btn" id="interrogateBtn">
            심문하기
            <span class="sub" id="interrogateSub">심문할 사건을 선택합니다</span>
          </button>

          <div class="action-list" id="actionList"></div>
          <div class="panel">
            <div class="panel-title">법정시간</div>
            <div class="panel-body hud">
              <div class="hud-row">
                <div class="seg-track" id="timeSegs"></div>
                <span class="hud-value" id="timeValue">0:00</span>
              </div>
            </div>
          </div>
          <div class="hint">
            <span>↑↓ 이동 · Enter 선택 · Tab 전환</span>
            <span>1 사건 · Space 심문 · V 판결</span>
          </div>
        </aside>

        <main class="col" aria-label="COURT">
          <div class="panel">
            <div class="panel-body" id="trialSubject">재판 중: -</div>
          </div>
          <div class="court-frame" id="courtFrame">
            <div class="player-bubble" id="playerBubble"></div>
            <div class="soul-bubble" id="soulBubble"></div>
            <div class="court-caption">
              <div id="courtMain">망자가 법정에 섰다.</div>
              <div class="sub" id="courtSub"></div>
            </div>
          </div>
          <div class="court-bottom">
            <section class="panel">
              <div class="panel-title panel-title-row">
                <span>금일 망자</span>
                <span id="remainingValue">남은 망자 0명</span>
              </div>
              <div class="panel-body mini-list" id="todayList"></div>
            </section>
            <section class="panel">
              <div class="panel-title">망자 프로필</div>
              <div class="panel-body mini-list scroll-focus" id="profileBox"></div>
            </section>
          </div>
        </main>

        <aside class="col" aria-label="RIGHT SIDE">
          <section class="panel" id="emptyBox" style="flex:1;min-height:0" aria-label="심문 선택">
            <div class="panel-title" id="emptyTitle">EMPTY</div>
            <div class="record-page" id="emptyPage"></div>
          </section>
          <section class="panel record-box" id="recordBox" aria-label="RECORD">
            <div class="panel-title">RECORD</div>
            <div class="record-pager">
              <span id="recordTitle">기록</span>
              <span id="recordPageInfo">0 / 0</span>
            </div>
            <div class="record-page" id="recordPage"></div>
          </section>
        </aside>
      </div>
    </section>

    <section id="screen-verdict" class="screen" aria-label="판결">
      <div class="verdict-card">
        <h2>판결</h2>
        <div class="verdict-warn" id="verdictWarn"></div>
        <div class="verdict-choices">
          <button type="button" class="verdict-choice hell" data-choice="hell">지옥</button>
          <button type="button" class="verdict-choice heaven" data-choice="heaven">천국</button>
        </div>
        <label class="sr-only" for="verdictReason">판결 이유</label>
        <textarea id="verdictReason" placeholder="판결 이유를 적을 수 있습니다 (선택)"></textarea>
        <button type="button" class="verdict-submit" id="verdictSubmit">판결 확정</button>
      </div>
    </section>

    <section id="screen-expedite" class="screen" aria-label="간이 판결">
      <div class="expedite-card">
        <h2>간이 판결</h2>
        <div class="expedite-body" id="expediteBody"></div>
        <div class="verdict-choices">
          <button type="button" class="verdict-choice heaven" data-expedite="heaven">무죄</button>
          <button type="button" class="verdict-choice hell" data-expedite="hell">유죄</button>
        </div>
      </div>
    </section>

    <section id="screen-end" class="screen" aria-label="판결 결과">
      <div class="end-overlay">
        <div id="endTitle" style="font-size:1.55rem;letter-spacing:0.1em;margin-bottom:0.5rem"></div>
        <div id="endSub" style="color:var(--muted);line-height:1.45"></div>
        <nav class="end-menu" id="endMenu" aria-label="판결 후 메뉴">
        </nav>
      </div>
    </section>

    <div class="modal-layer" id="menuModal" aria-label="메뉴 팝업">
      <div class="menu-popup">
        <div class="menu-popup-title">메뉴</div>
        <nav class="popup-menu" id="popupMenu"></nav>
      </div>
    </div>

    <div class="modal-layer" id="verdictConfirmModal" aria-label="판결 확인 팝업">
      <div class="menu-popup">
        <div class="menu-popup-title">판결 확인</div>
        <div class="confirm-text" id="verdictConfirmText"></div>
        <nav class="popup-menu" id="verdictConfirmMenu"></nav>
      </div>
    </div>

    <div id="toast" role="status"></div>

    <script src="assets/data/game-config.js"></script>
    <script src="assets/data/game-content.js"></script>
    <script src="assets/js/game.js"></script>
    <script>
      (function () {
        const Game = window.HellCourtGame;
        const ui = {
          screen: "title",
          titleIndex: 0,
          settingsIndex: 0,
          lobbyIndex: 0,
          eventIndex: 0,
          focusArea: "actions",
          actionIndex: 0,
          emptyMode: "blank",
          emptyIndex: 0,
          verdictIndex: 0,
          recordPage: 0,
          verdictChoice: "hell",
          verdictConfirmOpen: false,
          verdictConfirmIndex: 0,
          expediteIndex: 0,
          expediteChoice: "heaven",
          endIndex: 0,
          popupIndex: 0,
          menuOpen: false,
          settingsReturn: "title",
          unlockTimers: [],
        };

        const titleItems = [
          { id: "start", label: "재판 시작" },
          { id: "settings", label: "설정" },
        ];

        function showScreen(name) {
          ui.screen = name;
          ["title", "settings", "lobby", "ingame", "verdict", "expedite", "end"].forEach(function (s) {
            document.getElementById("screen-" + s).classList.toggle("active", s === name);
          });
        }

        const BGM = {
          audio: null,
          track: null,
          muted: false,
          paths() {
            const a = Game.contentAudio();
            return {
              court: a.bgm || "assets/audio/bgm_strict_verdict.mp3",
              heaven: a.bgmHeaven || "assets/audio/bgm_heaven_end.wav",
              hell: a.bgmHell || "assets/audio/bgm_hell_end.wav",
            };
          },
          volume() {
            return Game.balance().bgmVolume != null ? Game.balance().bgmVolume : 0.45;
          },
          loadMute() {
            try { this.muted = localStorage.getItem("hellcourt_bgm_muted") === "1"; }
            catch (e) { this.muted = false; }
          },
          setMuted(on) {
            this.muted = !!on;
            try { localStorage.setItem("hellcourt_bgm_muted", this.muted ? "1" : "0"); } catch (e) {}
            if (this.muted) this.stop();
          },
          toggleMuted() {
            this.setMuted(!this.muted);
            return this.muted;
          },
          stop() {
            if (!this.audio) return;
            this.audio.pause();
            this.audio.currentTime = 0;
            this.track = null;
          },
          play(track) {
            if (this.muted) return;
            const path = this.paths()[track || "court"];
            if (!path) return;
            if (!this.audio) {
              this.audio = new Audio();
              this.audio.loop = true;
            }
            if (this.track !== track) {
              this.audio.src = path;
              this.track = track;
            }
            this.audio.volume = this.volume();
            this.audio.play().catch(function () {});
          },
        };

        function playSfx(kind) {
          const a = Game.contentAudio();
          const path = kind === "confirm" ? a.uiConfirm : a.uiSelect;
          if (!path) return;
          const sfx = new Audio(path);
          sfx.volume = Game.balance().sfxVolume != null ? Game.balance().sfxVolume : 0.55;
          sfx.play().catch(function () {});
        }

        function toast(msg) {
          const el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(toast._t);
          toast._t = setTimeout(function () { el.classList.remove("show"); }, 1800);
        }

        function applyArt() {
          const art = Game.contentArt();
          if (art.titleBg) document.documentElement.style.setProperty("--title-bg", 'url("' + art.titleBg + '")');
          if (art.ingameBg) document.documentElement.style.setProperty("--ingame-bg", 'url("' + art.ingameBg + '")');
          if (art.stageSoul) document.documentElement.style.setProperty("--stage-art", 'url("' + art.stageSoul + '")');
        }

        function renderTitle() {
          const menu = document.getElementById("titleMenu");
          menu.innerHTML = "";
          titleItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "title-item" + (i === ui.titleIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.titleIndex = i;
              playSfx("select");
              confirmTitle();
            });
            menu.appendChild(btn);
          });
        }

        function settingsItems() {
          return [
            { id: "bgm", label: "BGM : " + (BGM.muted ? "OFF" : "ON") },
            { id: "back", label: "돌아가기" },
          ];
        }

        function renderSettings() {
          const menu = document.getElementById("settingsMenu");
          const items = settingsItems();
          ui._settingsItems = items;
          menu.innerHTML = "";
          items.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "settings-item" + (i === ui.settingsIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.settingsIndex = i;
              playSfx("select");
              confirmSettings();
            });
            menu.appendChild(btn);
          });
        }

        function confirmSettings() {
          const item = (ui._settingsItems || settingsItems())[ui.settingsIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "bgm") {
            BGM.toggleMuted();
            if (!BGM.muted) BGM.play("court");
            renderSettings();
            return;
          }
          if (ui.settingsReturn === "ingame" && Game.state && Game.state.phase === "trial") {
            showScreen("ingame");
            refreshTrial();
          } else {
            showScreen("title");
            renderTitle();
          }
        }

        function confirmTitle() {
          const item = titleItems[ui.titleIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "settings") {
            ui.settingsIndex = 0;
            ui.settingsReturn = "title";
            showScreen("settings");
            renderSettings();
            return;
          }
          Game.startNewRun();
          ui.lobbyIndex = 0;
          showScreen("lobby");
          renderLobby();
          setTimeout(function () { BGM.play("court"); }, 160);
        }

        function renderLobby() {
          const s = Game.state;
          if (!s || s.phase !== "lobby") return;
          const L = Game.labels();
          const remaining = s.today.filter(function (row) { return !row.verdict; }).length;
          const dutyDays = 100;
          const daysLeft = Math.max(0, dutyDays - s.day);
          document.getElementById("lobbyMeta").textContent =
            "Day " + s.day + " / " + dutyDays + " · 남은 근무일 " + daysLeft + "일" +
            " · 남은 법정시간 " + Game.formatCourtTime(s.courtTimeMinutes) +
            " · 금일 남은 망자 " + remaining + "/" + s.today.length;

          let text = "금일 망자 확인\n";
          s.today.forEach(function (row, i) {
            text += "\n" + (i + 1) + ". " + row.name + " · " + (row.verdict ? (row.verdict === "heaven" ? L.heaven : L.hell) : "미판결");
            if (row.summary) text += "\n   " + row.summary;
          });
          if (s.lastSummary) {
            text += "\n\n직전 판결\n" +
              "망자: " + s.lastSummary.deceasedName + "\n" +
              "판결: " + (s.lastSummary.choice === "heaven" ? L.heaven : L.hell) + "\n" +
              "확인 기록: CONTEXT " + s.lastSummary.contextRead + "/" + s.lastSummary.eventCount +
              " · 감정과 의도 " + s.lastSummary.intentRead + "/" + s.lastSummary.eventCount + "\n" +
              "남은 시간: " + s.lastSummary.courtTimeLeftLabel;
          }
          if (s.dayJustAdvanced) text += "\n\n하루가 지나 법정시간과 금일 공판이 갱신되었습니다.";
          if (!remaining) text += "\n\n금일 재판 업무가 끝났습니다. 남은 시간은 자유시간으로 이어집니다.";
          document.getElementById("lobbySummary").textContent = text;

          const actions = [
            {
              id: "trial",
              label: remaining ? "망자 재판 시작" : "금일 재판 완료",
              primary: !!remaining,
              disabled: !remaining,
            },
            {
              id: "free",
              label: "자유시간 확인",
              primary: !remaining,
            },
            {
              id: "nextday",
              label: "다음 날로",
            },
            {
              id: "title",
              label: "타이틀로",
            },
          ];
          ui._lobbyActions = actions;
          if (ui.lobbyIndex >= actions.length) ui.lobbyIndex = 0;
          const wrap = document.getElementById("lobbyActions");
          wrap.innerHTML = "";
          actions.forEach(function (a, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.disabled = !!a.disabled;
            btn.className = "lobby-btn" + (a.primary ? " primary" : "") + (i === ui.lobbyIndex ? " selected" : "");
            btn.textContent = a.label;
            btn.addEventListener("click", function () {
              if (a.disabled) return;
              ui.lobbyIndex = i;
              playSfx("select");
              confirmLobby();
            });
            wrap.appendChild(btn);
          });
        }

        function confirmLobby() {
          const a = (ui._lobbyActions || [])[ui.lobbyIndex];
          if (!a || a.disabled) return;
          playSfx("confirm");
          if (a.id === "title") {
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          if (a.id === "free") {
            toast("자유시간 세부 콘텐츠는 아직 미확정입니다. 남은 시간: " + Game.formatCourtTime(Game.state.courtTimeMinutes));
            return;
          }
          if (a.id === "nextday") {
            Game.advanceDay();
            ui.lobbyIndex = 0;
            renderLobby();
            return;
          }
          const started = Game.startTrial();
          if (!started) {
            toast("재판할 망자가 없습니다.");
            renderLobby();
            return;
          }
          ui.eventIndex = 0;
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          ui.recordPage = 0;
          showScreen("ingame");
          refreshTrial(true);
        }

        function formatCostMinutes(n) {
          return "-" + n + "분";
        }

        function selectedEvent() {
          const s = Game.state;
          return s && s.events ? s.events[ui.eventIndex] : null;
        }

        function selectEventByIndex(index) {
          const s = Game.state;
          if (!s || !s.events.length) return;
          ui.eventIndex = (index + s.events.length) % s.events.length;
          const ev = selectedEvent();
          if (ev) Game.selectEvent(ev.id);
          refreshTrial();
        }

        function actionCount() {
          return (ui._trialActions || []).length || 4;
        }

        function moveTrialSelection(dir) {
          const total = actionCount() + 3;
          if (!total) return;
          const current =
            ui.focusArea === "actions"
              ? ui.actionIndex
              : ui.focusArea === "record"
                ? actionCount()
                : ui.focusArea === "profile"
                  ? actionCount() + 1
                  : actionCount() + 2;
          const next = (current + dir + total) % total;
          if (next < actionCount()) {
            ui.focusArea = "actions";
            ui.actionIndex = next;
          } else if (next === actionCount()) {
            ui.focusArea = "record";
          } else if (next === actionCount() + 1) {
            ui.focusArea = "profile";
          } else {
            ui.focusArea = "empty";
          }
          refreshTrial();
        }

        function confirmTrialSelection() {
          if (ui.focusArea === "empty") {
            confirmEmptySelection();
            return;
          }
          if (ui.focusArea === "profile") {
            document.getElementById("profileBox").scrollTop += 72;
            return;
          }
          if (ui.focusArea === "record") {
            confirmRecord();
            return;
          }
          const action = (ui._trialActions || [])[ui.actionIndex];
          if (!action) return;
          if (action.id === "events") openEventRecord();
          else if (action.id === "interrogate") openInterrogatePicker();
          else confirmAction(action.id);
        }

        function readLabel(ev) {
          if (ev.contextRead && ev.intentRead) return "CONTEXT · 감정과 의도 확인";
          if (ev.contextRead) return "CONTEXT 확인";
          return "기본 사건 공개";
        }

        function interrogationCostLabel(ev) {
          const s = Game.state;
          const costs = Game.actionCosts();
          if (!ev.contextRead) {
            const short = s && s.courtTimeMinutes < costs.contextTime ? " · 시간 부족" : "";
            return "소모 예정: " + formatCostMinutes(costs.contextTime) + short;
          }
          if (!ev.intentRead) {
            const short = s && s.courtTimeMinutes < costs.intentTime ? " · 시간 부족" : "";
            return "소모 예정: " + formatCostMinutes(costs.intentTime) + short;
          }
          return "소모 예정: 없음 · 심문 완료";
        }

        function verdictLabel(choice) {
          return choice === "heaven" ? "무죄" : "유죄";
        }

        function verdictDescription(choice) {
          return choice === "heaven"
            ? "지옥으로 단죄하지 않고 천국으로 보냅니다."
            : "삶의 책임을 단죄하고 지옥으로 보냅니다.";
        }

        function renderEvents() {
          const s = Game.state;
          const ev = selectedEvent();
          const btn = document.getElementById("eventsBtn");
          const sub = document.getElementById("eventsSub");
          btn.classList.toggle("selected", ui.focusArea === "actions" && ui.actionIndex === 0);
          sub.textContent = "망자의 생애 기록을 열람합니다.";
        }

        function renderActions() {
          const actions = [
            { id: "events", label: "인생사건", sub: "망자의 생애 기록을 열람합니다.", external: true },
            { id: "interrogate", label: "심문하기", sub: "심문할 사건을 선택합니다", external: true },
            { id: "verdict", label: "판결하기", sub: "무죄 / 유죄 선택" },
            { id: "menu", label: "메뉴", sub: "설정 / 뒤로가기" },
          ];
          ui._trialActions = actions;
          const list = document.getElementById("actionList");
          list.innerHTML = "";
          actions.slice(2).forEach(function (a, offset) {
            const i = offset + 2;
            const btn = document.createElement("button");
            btn.type = "button";
            btn.disabled = !!a.disabled;
            btn.className = "action-btn" + (ui.focusArea === "actions" && ui.actionIndex === i ? " selected" : "");
            btn.innerHTML = escapeHtml(a.label) + '<span class="sub">' + escapeHtml(a.sub || "") + "</span>";
            btn.addEventListener("click", function () {
              if (a.disabled) return;
              ui.focusArea = "actions";
              ui.actionIndex = i;
              playSfx("select");
              confirmAction(a.id);
            });
            list.appendChild(btn);
          });
        }

        function renderCourt() {
          const s = Game.state;
          document.getElementById("courtMeta").textContent =
            s.courtName || "공정의 법정";
          document.getElementById("trialSubject").textContent = "재판 중: " + s.name;
        }

        function renderCourtBottom() {
          const s = Game.state;
          const L = Game.labels();
          document.getElementById("remainingValue").textContent = "남은 망자 " + Game.remainingSouls() + "명";
          document.getElementById("todayList").textContent = (s.today || []).map(function (row, i) {
            return (i + 1) + ". " + row.name + " · " +
              (row.verdict ? (row.verdict === "heaven" ? L.heaven : L.hell) : "미판결");
          }).join("\n");

          const vals = (s.values || []).join(", ") || "-";
          const conflicts = (s.coreConflictKeywords || []).join(", ") || "-";
          const life = (s.birthYear || "????") + " - " + (s.deathYear || "????") + (s.ageAtDeath != null ? " (" + s.ageAtDeath + "세)" : "");
          document.getElementById("profileBox").textContent =
            "이름: " + s.name + "\n" +
            "성별: " + (s.gender || "-") + "\n" +
            "생애: " + life + "\n" +
            "가치관: " + vals + "\n" +
            "갈등 키워드: " + conflicts + "\n\n" +
            (s.summary || "프로필 요약이 없습니다.");
          document.getElementById("profileBox").classList.toggle("selected", ui.focusArea === "profile");
        }

        function renderEmpty() {
          const box = document.getElementById("emptyBox");
          const title = document.getElementById("emptyTitle");
          const page = document.getElementById("emptyPage");
          box.classList.toggle("selected", ui.focusArea === "empty");
          const s = Game.state;
          if (ui.emptyMode !== "interrogate" || !s || !s.events || !s.events.length) {
            if (ui.emptyMode === "verdict") {
              title.textContent = "판결 선택";
              page.textContent =
                (ui.verdictIndex === 0 ? "▶ " : "  ") + "무죄\n" +
                "   " + verdictDescription("heaven") + "\n\n" +
                (ui.verdictIndex === 1 ? "▶ " : "  ") + "유죄\n" +
                "   " + verdictDescription("hell");
            } else {
              title.textContent = "EMPTY";
              page.textContent = "";
            }
            return;
          }
          title.textContent = "심문할 인생사건 선택";
          page.textContent = s.events.map(function (ev, i) {
            const mark = i === ui.emptyIndex ? "▶ " : "  ";
            const current = i === ui.eventIndex ? " · 현재 선택" : "";
            return mark + (i + 1) + ". " + (ev.year || "????") + " · " + ev.title + current + "\n   " + readLabel(ev) + "\n   " + interrogationCostLabel(ev);
          }).join("\n\n");
        }

        function openInterrogatePicker() {
          const s = Game.state;
          if (!s || !s.events || !s.events.length) return;
          ui.emptyMode = "interrogate";
          ui.emptyIndex = ui.eventIndex;
          ui.focusArea = "empty";
          setCourtText("심문할 사건 선택", "우측 상단 목록에서 인생사건을 고르십시오.");
          refreshTrial();
        }

        function moveEmptySelection(dir) {
          if (ui.emptyMode === "verdict") {
            ui.verdictIndex = (ui.verdictIndex + dir + 2) % 2;
            renderEmpty();
            return;
          }
          const s = Game.state;
          if (!s || !s.events || !s.events.length) return;
          ui.emptyIndex = (ui.emptyIndex + dir + s.events.length) % s.events.length;
          renderEmpty();
        }

        function confirmEmptySelection() {
          const s = Game.state;
          if (ui.emptyMode === "verdict") {
            ui.verdictChoice = ui.verdictIndex === 0 ? "heaven" : "hell";
            openVerdictConfirmPopup();
            return;
          }
          if (ui.emptyMode !== "interrogate" || !s || !s.events || !s.events.length) return;
          ui.eventIndex = ui.emptyIndex;
          const ev = selectedEvent();
          if (ev) Game.selectEvent(ev.id);
          ui.focusArea = "actions";
          ui.actionIndex = 1;
          doInterrogate();
        }

        function renderTime() {
          const s = Game.state;
          const segs = document.getElementById("timeSegs");
          const hours = s.courtTimeHours || 8;
          const hoursLeft = Math.ceil((s.courtTimeMinutes || 0) / 60);
          segs.innerHTML = "";
          for (let i = 0; i < hours; i += 1) {
            const d = document.createElement("span");
            d.className = "seg" + (i < hoursLeft ? " on" : "");
            segs.appendChild(d);
          }
          document.getElementById("timeValue").textContent = Game.formatCourtTime(s.courtTimeMinutes);
        }

        function recordPages() {
          const s = Game.state;
          if (!s || !s.events || !s.events.length) {
            return [{ title: "기록 없음", text: "기록할 인생사건이 없습니다." }];
          }
          const pages = [];
          s.events.forEach(function (ev, i) {
            const head = (i + 1) + ". " + (ev.year || "????") + " · " + ev.title;
            pages.push({
              eventId: ev.id,
              title: head + " · 기본 사건",
              text:
                head +
                (ev.age != null ? " (" + ev.age + "세)" : "") +
                "\n\n[기본 사건]\n" +
                (ev.summary || "기본 사건 정보가 없습니다."),
            });
            pages.push({
              eventId: ev.id,
              title: head + " · CONTEXT",
              text:
                head +
                "\n\n[CONTEXT]\n" +
                (ev.contextRead ? (ev.contextText || "CONTEXT 정보가 없습니다.") : "아직 조사하지 않았습니다."),
            });
            pages.push({
              eventId: ev.id,
              title: head + " · 감정과 의도",
              text:
                head +
                "\n\n[감정과 의도]\n" +
                (ev.intentRead ? (ev.intentText || "감정과 의도 정보가 없습니다.") : "아직 확인하지 않았습니다."),
            });
          });
          return pages;
        }

        function renderRecord() {
          const pages = recordPages();
          ui.recordPage = Math.max(0, Math.min(ui.recordPage, pages.length - 1));
          const page = pages[ui.recordPage];
          document.getElementById("recordBox").classList.toggle("selected", ui.focusArea === "record");
          document.getElementById("recordTitle").textContent = page.title;
          document.getElementById("recordPageInfo").textContent = (ui.recordPage + 1) + " / " + pages.length;
          document.getElementById("recordPage").textContent = page.text;
        }

        function moveRecordPage(dir) {
          const pages = recordPages();
          if (!pages.length) return;
          ui.recordPage = (ui.recordPage + dir + pages.length) % pages.length;
          syncEventFromRecordPage(pages[ui.recordPage]);
          renderRecord();
        }

        function openEventRecord() {
          ui.recordPage = 0;
          ui.focusArea = "record";
          syncEventFromRecordPage(recordPages()[0]);
          renderRecord();
        }

        function confirmRecord() {
          moveRecordPage(1);
        }

        function syncEventFromRecordPage(page) {
          const s = Game.state;
          if (!s || !page || !page.eventId) return;
          const idx = s.events.findIndex(function (ev) { return ev.id === page.eventId; });
          if (idx < 0) return;
          ui.eventIndex = idx;
          Game.selectEvent(page.eventId);
        }

        function setCourtText(main, sub) {
          document.getElementById("courtMain").textContent = main || "";
          document.getElementById("courtSub").textContent = sub || "";
        }

        function previewAnswer(text) {
          const value = String(text || "").replace(/\s+/g, " ").trim();
          if (!value) return "...";
          return value.length > 94 ? value.slice(0, 94) + "..." : value;
        }

        function interrogationQuestion(type, eventTitle) {
          if (type === "context") {
            return "이 사건에 숨겨진 사실을 말해라.\n" + (eventTitle || "");
          }
          return "그때 네 감정과 의도는 무엇이었지?\n" + (eventTitle || "");
        }

        function clearUnlockTimers() {
          while (ui.unlockTimers.length) clearTimeout(ui.unlockTimers.pop());
        }

        function showUnlockEffect(type, text, eventTitle) {
          clearUnlockTimers();
          const player = document.getElementById("playerBubble");
          const bubble = document.getElementById("soulBubble");
          const frame = document.getElementById("courtFrame");
          const record = document.getElementById("recordBox");
          player.textContent = "“" + interrogationQuestion(type, eventTitle) + "”";
          player.className = "player-bubble " + type;
          bubble.textContent = "";
          bubble.className = "soul-bubble " + type;
          frame.classList.remove("pulse");
          record.classList.remove("updated");
          void player.offsetWidth;
          player.classList.add("show");
          ui.unlockTimers.push(setTimeout(function () {
            bubble.textContent = "“" + previewAnswer(text) + "”";
            bubble.className = "soul-bubble " + type;
            void bubble.offsetWidth;
            bubble.classList.add("show");
          }, 1050));
          frame.classList.add("pulse");
          record.classList.add("updated");
        }

        function refreshTrial(fresh) {
          const s = Game.state;
          if (!s || s.phase !== "trial") return;
          renderTime();
          renderCourt();
          renderCourtBottom();
          renderEvents();
          renderActions();
          renderInterrogate();
          renderEmpty();
          renderRecord();
          if (fresh) {
            setCourtText(s.name + "의 재판이 시작되었다.", s.intro || "인생사건을 확인하고 필요한 만큼 조사하십시오.");
            const ev = selectedEvent();
            if (ev) Game.selectEvent(ev.id);
          }
        }

        function showBasic() {
          const r = Game.inspectBasic();
          if (!r.ok) return;
          ui.recordPage = ui.eventIndex * 3;
          setCourtText("기본 사건 확인", r.event.title);
          refreshTrial();
        }

        function renderInterrogate() {
          const ev = Game.getSelectedEvent();
          const btn = document.getElementById("interrogateBtn");
          const sub = document.getElementById("interrogateSub");
          btn.disabled = false;
          if (!ev) {
            btn.classList.toggle("selected", ui.focusArea === "actions" && ui.actionIndex === 1);
            sub.textContent = "심문할 사건을 선택합니다";
            return;
          }
          if (!ev.contextRead) {
            btn.classList.toggle("selected", ui.focusArea === "actions" && ui.actionIndex === 1);
            sub.textContent = "심문할 사건을 선택합니다";
            return;
          }
          if (!ev.intentRead) {
            btn.classList.toggle("selected", ui.focusArea === "actions" && ui.actionIndex === 1);
            sub.textContent = "심문할 사건을 선택합니다";
            return;
          }
          btn.classList.toggle("selected", ui.focusArea === "actions" && ui.actionIndex === 1);
          sub.textContent = "심문할 사건을 선택합니다";
        }

        function doContext() {
          const r = Game.investigateContext();
          if (!r.ok) {
            if (r.reason === "no_time") toast("남은 법정시간이 부족합니다.");
            else if (r.reason === "already") toast("이미 확인한 CONTEXT입니다.");
            return;
          }
          playSfx("confirm");
          ui.recordPage = ui.eventIndex * 3 + 1;
          setCourtText("CONTEXT 조사", r.event.title);
          refreshTrial();
          showUnlockEffect("context", r.text, r.event.title);
        }

        function doIntent() {
          const r = Game.investigateIntent();
          if (!r.ok) {
            if (r.reason === "need_context") toast("먼저 CONTEXT를 조사해야 합니다.");
            else if (r.reason === "no_time") toast("남은 법정시간이 부족합니다.");
            else if (r.reason === "already") toast("이미 확인한 감정과 의도입니다.");
            return;
          }
          playSfx("confirm");
          ui.recordPage = ui.eventIndex * 3 + 2;
          setCourtText("감정과 의도 확인", r.event.title);
          refreshTrial();
          showUnlockEffect("intent", r.text, r.event.title);
        }

        function doInterrogate() {
          const ev = Game.getSelectedEvent();
          if (!ev) return;
          if (!ev.contextRead) {
            doContext();
            return;
          }
          if (!ev.intentRead) {
            doIntent();
            return;
          }
          toast("이 사건의 심문 기록은 모두 확인했습니다.");
        }

        function confirmAction(id) {
          if (id === "events") openEventRecord();
          else if (id === "verdict") openVerdictPicker();
          else if (id === "menu") openMenuPopup();
        }

        function openVerdictPicker() {
          if (!Game.state || Game.state.phase !== "trial") return;
          ui.emptyMode = "verdict";
          ui.verdictIndex = 0;
          ui.focusArea = "empty";
          setCourtText("판결 선택", "우측 상단에서 무죄 또는 유죄를 선택하십시오.");
          refreshTrial();
        }

        const popupItems = [
          { id: "settings", label: "설정" },
          { id: "back", label: "뒤로가기" },
        ];

        function renderMenuPopup() {
          const menu = document.getElementById("popupMenu");
          menu.innerHTML = "";
          popupItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "popup-item" + (i === ui.popupIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.popupIndex = i;
              playSfx("select");
              confirmMenuPopup();
            });
            menu.appendChild(btn);
          });
        }

        function openMenuPopup() {
          ui.menuOpen = true;
          ui.popupIndex = 0;
          renderMenuPopup();
          document.getElementById("menuModal").classList.add("active");
        }

        function closeMenuPopup() {
          ui.menuOpen = false;
          document.getElementById("menuModal").classList.remove("active");
        }

        const verdictConfirmItems = [
          { id: "confirm", label: "판결 확정" },
          { id: "back", label: "다시 선택" },
        ];

        function renderVerdictConfirmPopup() {
          const menu = document.getElementById("verdictConfirmMenu");
          const label = verdictLabel(ui.verdictChoice);
          document.getElementById("verdictConfirmText").textContent =
            label + " 판결을 확정하시겠습니까?\n" + verdictDescription(ui.verdictChoice);
          menu.innerHTML = "";
          verdictConfirmItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "popup-item" + (i === ui.verdictConfirmIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.verdictConfirmIndex = i;
              playSfx("select");
              confirmVerdictConfirmPopup();
            });
            menu.appendChild(btn);
          });
        }

        function openVerdictConfirmPopup() {
          ui.verdictConfirmOpen = true;
          ui.verdictConfirmIndex = 0;
          renderVerdictConfirmPopup();
          document.getElementById("verdictConfirmModal").classList.add("active");
        }

        function closeVerdictConfirmPopup() {
          ui.verdictConfirmOpen = false;
          document.getElementById("verdictConfirmModal").classList.remove("active");
        }

        function confirmVerdictConfirmPopup() {
          const item = verdictConfirmItems[ui.verdictConfirmIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "back") {
            closeVerdictConfirmPopup();
            return;
          }
          closeVerdictConfirmPopup();
          submitVerdictFromEmpty();
        }

        function confirmMenuPopup() {
          const item = popupItems[ui.popupIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "back") {
            closeMenuPopup();
            return;
          }
          if (item.id === "settings") {
            closeMenuPopup();
            ui.settingsIndex = 0;
            ui.settingsReturn = "ingame";
            showScreen("settings");
            renderSettings();
            return;
          }
        }

        function openVerdict() {
          playSfx("confirm");
          const opened = Game.openVerdict();
          if (!opened.ok) return;
          ui.verdictChoice = "hell";
          document.getElementById("verdictReason").value = "";
          document.getElementById("verdictWarn").textContent =
            "판결에는 시스템이 정한 정답이 없습니다.\n현재까지 확보한 RECORD를 기준으로 천국 또는 지옥을 선택하십시오.";
          renderVerdictChoices();
          showScreen("verdict");
        }

        function submitVerdictFromEmpty() {
          const opened = Game.openVerdict();
          if (!opened.ok) return;
          const r = Game.submitVerdict(ui.verdictChoice, "");
          if (!r.ok) return;
          const L = Game.labels();
          const art = Game.contentArt();
          const end = document.getElementById("screen-end");
          if (ui.verdictChoice === "heaven" && art.verdictHeaven) {
            end.style.backgroundImage = 'url("' + art.verdictHeaven + '")';
            BGM.play("heaven");
          } else if (ui.verdictChoice === "hell" && art.verdictHell) {
            end.style.backgroundImage = 'url("' + art.verdictHell + '")';
            BGM.play("hell");
          } else {
            end.style.backgroundImage = "";
          }
          document.getElementById("endTitle").textContent = ui.verdictChoice === "heaven" ? L.heaven : L.hell;
          document.getElementById("endSub").textContent =
            r.summary.deceasedName + "에 대한 판결이 확정되었다.\n남은 법정시간 " + r.summary.courtTimeLeftLabel;
          ui.endIndex = 0;
          renderEndMenu();
          showScreen("end");
        }

        function resetTrialUi() {
          ui.eventIndex = 0;
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          ui.emptyMode = "blank";
          ui.emptyIndex = 0;
          ui.recordPage = 0;
        }

        function startNextTrial() {
          const started = Game.startTrial();
          if (!started) {
            showLobbyFromEnd();
            return;
          }
          resetTrialUi();
          showScreen("ingame");
          refreshTrial(true);
        }

        function showLobbyFromEnd() {
          Game.finishToLobby();
          showScreen("lobby");
          renderLobby();
          BGM.play("court");
        }

        function shouldExpediteVerdicts() {
          return Game.remainingSouls() > 0 && (Game.courtTimeMinutes || 0) <= 0;
        }

        function showExpedite() {
          ui.expediteIndex = 0;
          ui.expediteChoice = "heaven";
          renderExpedite();
          showScreen("expedite");
        }

        function renderExpedite() {
          const rows = Game.remainingSoulRows();
          const row = rows[0];
          if (!row) {
            showLobbyFromEnd();
            return;
          }
          document.getElementById("expediteBody").textContent =
            "법정시간이 종료되었습니다.\n남은 망자는 정식 심문 없이 간이 판결로 처리합니다.\n\n" +
            "대상: " + row.name + "\n" +
            (row.summary || "프로필 요약이 없습니다.") + "\n\n" +
            "남은 망자: " + rows.length + "명";
          document.querySelectorAll("[data-expedite]").forEach(function (btn) {
            const choice = btn.getAttribute("data-expedite");
            btn.classList.toggle("selected", choice === ui.expediteChoice);
          });
        }

        function submitExpediteVerdict() {
          const row = Game.remainingSoulRows()[0];
          if (!row) {
            showLobbyFromEnd();
            return;
          }
          const r = Game.quickSubmitVerdict(row.index, ui.expediteChoice, "법정시간 종료 후 간이 판결");
          if (!r.ok) return;
          playSfx("confirm");
          if (Game.remainingSouls() > 0) {
            renderExpedite();
            return;
          }
          showLobbyFromEnd();
        }

        function renderVerdictChoices() {
          document.querySelectorAll("[data-choice]").forEach(function (btn) {
            btn.classList.toggle("selected", btn.getAttribute("data-choice") === ui.verdictChoice);
          });
        }

        function submitVerdict() {
          const reason = document.getElementById("verdictReason").value || "";
          const r = Game.submitVerdict(ui.verdictChoice, reason);
          if (!r.ok) return;
          const L = Game.labels();
          const art = Game.contentArt();
          const end = document.getElementById("screen-end");
          if (ui.verdictChoice === "heaven" && art.verdictHeaven) {
            end.style.backgroundImage = 'url("' + art.verdictHeaven + '")';
            BGM.play("heaven");
          } else if (ui.verdictChoice === "hell" && art.verdictHell) {
            end.style.backgroundImage = 'url("' + art.verdictHell + '")';
            BGM.play("hell");
          } else {
            end.style.backgroundImage = "";
          }
          document.getElementById("endTitle").textContent = ui.verdictChoice === "heaven" ? L.heaven : L.hell;
          document.getElementById("endSub").textContent =
            r.summary.deceasedName + "에 대한 판결이 확정되었다.\n남은 법정시간 " + r.summary.courtTimeLeftLabel;
          ui.endIndex = 0;
          renderEndMenu();
          showScreen("end");
        }

        function renderEndMenu() {
          const menu = document.getElementById("endMenu");
          const remaining = Game.remainingSouls();
          const nextLabel = shouldExpediteVerdicts()
            ? "남은 망자 간이 판결"
            : remaining > 0
              ? "다음 재판으로"
              : "로비로";
          const items = [
            { id: "continue", label: nextLabel },
            { id: "title", label: "심판종료" },
          ];
          ui._endItems = items;
          menu.innerHTML = "";
          items.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "end-menu-item" + (i === ui.endIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.endIndex = i;
              playSfx("select");
              renderEndMenu();
              confirmEnd();
            });
            menu.appendChild(btn);
          });
        }

        function confirmEnd() {
          const item = (ui._endItems || [])[ui.endIndex];
          if (!item) return;
          playSfx("confirm");
          if (item.id === "title") {
            Game.finishToLobby();
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          if (shouldExpediteVerdicts()) {
            showExpedite();
            return;
          }
          if (Game.remainingSouls() > 0) {
            startNextTrial();
            return;
          }
          showLobbyFromEnd();
        }

        function escapeHtml(value) {
          return String(value == null ? "" : value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        document.querySelectorAll("[data-choice]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ui.verdictChoice = btn.getAttribute("data-choice");
            playSfx("select");
            renderVerdictChoices();
          });
        });
        document.querySelectorAll("[data-expedite]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            ui.expediteChoice = btn.getAttribute("data-expedite");
            playSfx("select");
            renderExpedite();
            submitExpediteVerdict();
          });
        });
        document.getElementById("verdictSubmit").addEventListener("click", submitVerdict);
        document.getElementById("eventsBtn").addEventListener("click", function () {
          ui.focusArea = "actions";
          ui.actionIndex = 0;
          playSfx("select");
          openEventRecord();
        });
        document.getElementById("interrogateBtn").addEventListener("click", function () {
          ui.focusArea = "actions";
          ui.actionIndex = 1;
          playSfx("select");
          openInterrogatePicker();
        });
        document.getElementById("menuModal").addEventListener("click", function (e) {
          if (e.target.id === "menuModal") closeMenuPopup();
        });
        document.getElementById("verdictConfirmModal").addEventListener("click", function (e) {
          if (e.target.id === "verdictConfirmModal") closeVerdictConfirmPopup();
        });
        document.getElementById("profileBox").addEventListener("click", function () {
          ui.focusArea = "profile";
          playSfx("select");
          refreshTrial();
        });
        document.getElementById("playerBubble").addEventListener("animationend", function () {
          this.classList.remove("show");
        });
        document.getElementById("soulBubble").addEventListener("animationend", function () {
          this.classList.remove("show");
        });
        document.getElementById("courtFrame").addEventListener("animationend", function () {
          this.classList.remove("pulse");
        });
        document.getElementById("recordBox").addEventListener("animationend", function () {
          this.classList.remove("updated");
        });
        document.querySelectorAll("#endMenu .end-menu-item").forEach(function (btn, i) {
          btn.addEventListener("click", function () {
            ui.endIndex = i;
            playSfx("select");
            renderEndMenu();
            confirmEnd();
          });
        });

        document.addEventListener("keydown", function (e) {
          if (ui.verdictConfirmOpen) {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.verdictConfirmIndex = (ui.verdictConfirmIndex + (e.key === "ArrowDown" ? 1 : -1) + verdictConfirmItems.length) % verdictConfirmItems.length;
              playSfx("select");
              renderVerdictConfirmPopup();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmVerdictConfirmPopup();
            } else if (e.key === "Escape") {
              e.preventDefault();
              closeVerdictConfirmPopup();
            }
            return;
          }
          if (ui.menuOpen) {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.popupIndex = (ui.popupIndex + (e.key === "ArrowDown" ? 1 : -1) + popupItems.length) % popupItems.length;
              playSfx("select");
              renderMenuPopup();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmMenuPopup();
            } else if (e.key === "Escape") {
              e.preventDefault();
              closeMenuPopup();
            }
            return;
          }
          if (ui.screen === "title") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.titleIndex = (ui.titleIndex + (e.key === "ArrowDown" ? 1 : -1) + titleItems.length) % titleItems.length;
              playSfx("select");
              renderTitle();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmTitle();
            }
            return;
          }
          if (ui.screen === "settings") {
            const items = ui._settingsItems || settingsItems();
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.settingsIndex = (ui.settingsIndex + (e.key === "ArrowDown" ? 1 : -1) + items.length) % items.length;
              playSfx("select");
              renderSettings();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmSettings();
            } else if (e.key === "Escape") {
              e.preventDefault();
              if (ui.settingsReturn === "ingame" && Game.state && Game.state.phase === "trial") {
                showScreen("ingame");
                refreshTrial();
              } else {
                showScreen("title");
                renderTitle();
              }
            }
            return;
          }
          if (ui.screen === "lobby") {
            const n = (ui._lobbyActions || []).length;
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              ui.lobbyIndex = (ui.lobbyIndex + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
              playSfx("select");
              renderLobby();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmLobby();
            }
            return;
          }
          if (ui.screen === "verdict") {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              ui.verdictChoice = ui.verdictChoice === "hell" ? "heaven" : "hell";
              playSfx("select");
              renderVerdictChoices();
            } else if (e.key === "Enter") {
              e.preventDefault();
              submitVerdict();
            } else if (e.key === "Escape") {
              e.preventDefault();
              Game.state.phase = "trial";
              showScreen("ingame");
              refreshTrial();
            }
            return;
          }
          if (ui.screen === "expedite") {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.expediteChoice = ui.expediteChoice === "hell" ? "heaven" : "hell";
              playSfx("select");
              renderExpedite();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              submitExpediteVerdict();
            }
            return;
          }
          if (ui.screen === "end") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.endIndex = (ui.endIndex + (e.key === "ArrowDown" ? 1 : -1) + 2) % 2;
              playSfx("select");
              renderEndMenu();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmEnd();
            }
            return;
          }
          if (ui.screen !== "ingame" || !Game.state || Game.state.phase !== "trial") return;
          if (e.key === "Tab") {
            e.preventDefault();
            if (ui.focusArea === "actions") ui.focusArea = "record";
            else if (ui.focusArea === "record") ui.focusArea = "profile";
            else ui.focusArea = "actions";
            refreshTrial();
            playSfx("select");
          } else if (ui.focusArea === "profile" && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            const box = document.getElementById("profileBox");
            box.scrollTop += e.key === "ArrowDown" ? 36 : -36;
          } else if (ui.focusArea === "empty" && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            moveEmptySelection(e.key === "ArrowDown" || e.key === "ArrowRight" ? 1 : -1);
            playSfx("select");
          } else if (ui.focusArea === "record" && (e.key === "ArrowLeft" || e.key === "ArrowRight" || e.key === "ArrowUp" || e.key === "ArrowDown")) {
            e.preventDefault();
            moveRecordPage(e.key === "ArrowLeft" || e.key === "ArrowUp" ? -1 : 1);
            playSfx("select");
          } else if (e.key === "ArrowUp" || e.key === "ArrowDown") {
            e.preventDefault();
            moveTrialSelection(e.key === "ArrowDown" ? 1 : -1);
            playSfx("select");
          } else if (e.key === "Enter") {
            e.preventDefault();
            confirmTrialSelection();
          } else if (e.key === "1") {
            e.preventDefault();
            ui.focusArea = "actions";
            ui.actionIndex = 0;
            openEventRecord();
          } else if (e.key === " ") {
            e.preventDefault();
            ui.focusArea = "actions";
            ui.actionIndex = 1;
            openInterrogatePicker();
          } else if (e.key.toLowerCase() === "v") {
            e.preventDefault();
            openVerdictPicker();
          } else if (e.key === "Escape") {
            e.preventDefault();
            if (ui.emptyMode !== "blank") {
              ui.emptyMode = "blank";
              ui.focusArea = "actions";
              refreshTrial();
            }
          }
        });

        BGM.loadMute();
        applyArt();
        renderTitle();
        console.info("[지옥법정] current-planning MVP boot", {
          config: window.GAME_CONFIG && window.GAME_CONFIG.version,
          content: window.GAME_CONTENT && window.GAME_CONTENT.version,
        });
      })();
    </script>
  </body>
</html>
