<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>지옥법정</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --bg: #050505;
        --panel: rgba(0, 0, 0, 0.72);
        --text: #f2f2f2;
        --muted: rgba(242, 242, 242, 0.45);
        --line: rgba(232, 232, 232, 0.55);
        --accent: #c62828;
        --spirit: #e8c56a;
        --time: #d8d8d8;
        --btn: #2a2a2a;
        --btn-hover: #3a3a3a;
        --focus: #ffffff;
      }

      @font-face {
        font-family: "GameUI";
        src: url("assets/fonts/PF_start_dust_3.0_ExtraBold.ttf") format("truetype");
        font-weight: 800;
        font-display: swap;
      }

      * { box-sizing: border-box; }
      html, body {
        width: 100%; height: 100%; margin: 0; overflow: hidden;
        background: var(--bg); color: var(--text);
        font-family: "GameUI", "Malgun Gothic", sans-serif;
      }
      button, textarea { font: inherit; color: inherit; }
      button { background: none; border: none; cursor: pointer; padding: 0; }
      .sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
      }
      .screen {
        position: absolute; inset: 0; display: none;
        flex-direction: column; align-items: center; justify-content: center;
      }
      .screen.active { display: flex; }

      /* TITLE */
      #screen-title {
        justify-content: flex-end;
        padding-bottom: clamp(4rem, 12vh, 7rem);
        background: var(--title-bg, #050505) center / cover no-repeat;
        image-rendering: pixelated;
      }
      .title-menu { display: flex; flex-direction: column; gap: 0.85rem; align-items: center; }
      .title-item {
        min-width: 14rem; padding: 0.65rem 1.4rem;
        border: 2px solid transparent; letter-spacing: 0.12em;
        background: rgba(0,0,0,0.45);
      }
      .title-item.selected { border-color: var(--focus); }

      /* LOBBY */
      #screen-lobby {
        background: radial-gradient(ellipse at center, #1a1210 0%, #050505 70%);
        padding: 2rem;
      }
      .lobby-card {
        width: min(720px, 92vw);
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 1.5rem 1.75rem;
      }
      .lobby-card h1 {
        margin: 0 0 0.35rem; font-size: 1.6rem; letter-spacing: 0.08em;
      }
      .lobby-meta { color: var(--muted); margin-bottom: 1.25rem; font-size: 0.95rem; }
      .lobby-summary {
        min-height: 8rem; border: 1px solid rgba(255,255,255,0.12);
        padding: 1rem; margin-bottom: 1.25rem; white-space: pre-wrap; line-height: 1.55;
        color: rgba(242,242,242,0.88);
      }
      .lobby-actions { display: flex; gap: 0.75rem; flex-wrap: wrap; }
      .lobby-btn {
        padding: 0.7rem 1.2rem; border: 1px solid var(--line);
        background: var(--btn); letter-spacing: 0.06em;
      }
      .lobby-btn.primary { border-color: var(--spirit); color: var(--spirit); }
      .lobby-btn.selected, .lobby-btn:hover { background: var(--btn-hover); }
      .lobby-btn:disabled { opacity: 0.4; cursor: default; }

      /* INGAME — Figma-inspired 3-column */
      #screen-ingame {
        align-items: stretch; justify-content: stretch;
        background: var(--ingame-bg, #0a0a0a) center / cover no-repeat;
      }
      .trial-shell {
        flex: 1; display: grid;
        grid-template-columns: minmax(280px, 34%) minmax(240px, 32%) minmax(260px, 34%);
        gap: 0.75rem; padding: 1rem 1.1rem 0.85rem;
        max-width: 1600px; width: 100%; margin: 0 auto;
      }
      .col {
        display: flex; flex-direction: column; gap: 0.55rem; min-height: 0;
      }
      .panel-box {
        border: 1px solid var(--line);
        background: var(--panel);
        padding: 0.7rem 0.85rem;
      }
      .court-title {
        font-size: 1.35rem; letter-spacing: 0.1em; text-align: center;
        padding: 0.55rem 0.4rem;
      }
      .hud-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.35rem; }
      .hud-label { min-width: 4.2rem; color: var(--muted); font-size: 0.9rem; }
      .seg-track {
        flex: 1; display: flex; gap: 4px; align-items: center;
      }
      .seg {
        flex: 1; height: 10px; background: rgba(255,255,255,0.12);
        border: 1px solid rgba(255,255,255,0.2);
      }
      .seg.on { background: var(--time); border-color: #fff; }
      .spirit-track {
        flex: 1; height: 14px; background: rgba(255,255,255,0.1);
        border: 1px solid rgba(232,197,106,0.35); position: relative;
      }
      .spirit-fill {
        height: 100%; width: 50%; background: linear-gradient(90deg, #a8842e, var(--spirit));
      }
      .hud-value { min-width: 3.2rem; text-align: right; font-size: 0.9rem; }
      .guide-line {
        text-align: center; color: rgba(242,242,242,0.8);
        padding: 0.45rem; letter-spacing: 0.04em;
      }

      .tabs { display: flex; gap: 0.35rem; position: relative; z-index: 2; }
      .tab {
        flex: 1; padding: 0.55rem 0.3rem; border: 1px solid var(--line);
        background: rgba(20,20,20,0.85); font-size: 0.9rem; letter-spacing: 0.04em;
        cursor: pointer; pointer-events: auto;
      }
      .tab:hover { background: #2a2a2a; }
      .tab.active { border-color: #fff; background: #222; }
      .tab:focus-visible { outline: 1px solid #fff; outline-offset: 2px; }

      .list-box {
        flex: 1; min-height: 220px; overflow: auto;
        border: 1px solid var(--line); background: rgba(0,0,0,0.55);
        padding: 0.4rem 0.2rem;
      }
      .event-row, .menu-row, .detail-line {
        display: flex; align-items: flex-start; gap: 0.45rem;
        padding: 0.45rem 0.65rem; cursor: pointer;
      }
      .event-row.selected, .menu-row.selected {
        outline: 1px solid #fff; background: rgba(255,255,255,0.06);
      }
      .cursor { width: 1rem; color: var(--spirit); flex-shrink: 0; }
      .event-title { line-height: 1.35; }
      .event-meta { color: var(--muted); font-size: 0.78rem; margin-top: 0.15rem; }
      .detail-body { padding: 0.75rem; line-height: 1.55; white-space: pre-wrap; }
      .hint-bar {
        display: flex; justify-content: space-between; align-items: center;
        color: var(--muted); font-size: 0.8rem; padding: 0.15rem 0.25rem;
      }

      .stage-col { min-height: 0; }
      .top-chips {
        display: flex; justify-content: space-between; gap: 0.5rem;
        color: var(--muted); font-size: 0.85rem; padding: 0.2rem 0.15rem;
      }
      .stage-frame {
        flex: 1; border: 1px solid var(--line); background: rgba(0,0,0,0.5);
        display: flex; flex-direction: column; min-height: 420px;
        background-image: var(--stage-art, none);
        background-position: center top; background-size: cover; background-repeat: no-repeat;
      }
      .stage-speech {
        margin-top: auto; padding: 1rem 1.1rem 1.15rem;
        background: linear-gradient(transparent, rgba(0,0,0,0.88) 28%);
        white-space: pre-wrap; line-height: 1.55; min-height: 7rem;
      }
      .stage-speech .sub { color: var(--muted); margin-top: 0.45rem; font-size: 0.92rem; }

      .action-stack { display: flex; flex-direction: column; gap: 0.55rem; }
      .action-btn {
        display: flex; align-items: center; gap: 0.75rem;
        padding: 0.75rem 0.9rem; border: 1px solid var(--line);
        background: rgba(25,25,25,0.9); text-align: left;
      }
      .action-btn .icon {
        width: 48px; height: 48px; border: 1px solid var(--line);
        display: grid; place-items: center; flex-shrink: 0;
        background: #111; font-size: 0.75rem; color: var(--muted);
      }
      .action-btn.selected { border-color: #fff; }
      .action-btn:disabled { opacity: 0.35; cursor: default; }
      .action-btn .cost { display: block; color: var(--muted); font-size: 0.78rem; margin-top: 0.2rem; }
      .desc-box {
        flex: 1; min-height: 140px; border: 1px solid var(--line);
        background: rgba(0,0,0,0.55); padding: 0.85rem; line-height: 1.5;
        color: rgba(242,242,242,0.85); white-space: pre-wrap;
      }
      .right-hint { color: var(--muted); font-size: 0.8rem; text-align: right; }

      /* VERDICT */
      #screen-verdict { background: #080808; padding: 2rem; }
      .verdict-card {
        width: min(560px, 92vw); border: 1px solid var(--line);
        background: var(--panel); padding: 1.5rem;
      }
      .verdict-card h2 { margin: 0 0 0.75rem; letter-spacing: 0.08em; }
      .verdict-warn { color: #e8a0a0; margin-bottom: 0.85rem; line-height: 1.4; }
      .verdict-choices { display: flex; gap: 0.75rem; margin-bottom: 0.85rem; }
      .verdict-choice {
        flex: 1; padding: 0.9rem; border: 1px solid var(--line); background: var(--btn);
      }
      .verdict-choice.selected { border-color: #fff; }
      .verdict-choice.hell.selected { border-color: var(--accent); color: #ffb4b4; }
      .verdict-choice.heaven.selected { border-color: #8ec8ff; color: #b8dcff; }
      #verdictReason {
        width: 100%; min-height: 5rem; resize: vertical;
        background: #111; border: 1px solid var(--line); padding: 0.65rem;
      }
      .verdict-submit {
        margin-top: 0.85rem; width: 100%; padding: 0.75rem;
        border: 1px solid var(--line); background: var(--btn);
      }
      .verdict-submit.selected { border-color: #fff; }

      /* END — 판결 결과 + 메뉴 */
      #screen-end {
        justify-content: flex-end;
        align-items: center;
        background: #050505 center / cover no-repeat;
        padding-bottom: clamp(3rem, 10vh, 5.5rem);
      }
      .end-overlay {
        background: rgba(0,0,0,0.55); padding: 1.5rem 2rem;
        border: 1px solid var(--line); text-align: center;
        min-width: min(360px, 88vw);
      }
      .end-menu {
        display: flex; flex-direction: column; gap: 0.65rem;
        margin-top: 1.25rem; align-items: stretch;
      }
      .end-menu-item {
        padding: 0.7rem 1.2rem; border: 2px solid transparent;
        background: rgba(0,0,0,0.45); letter-spacing: 0.08em;
      }
      .end-menu-item.selected,
      .end-menu-item:hover { border-color: var(--focus); background: rgba(30,30,30,0.85); }

      #toast {
        position: fixed; left: 50%; bottom: 1.5rem; transform: translateX(-50%);
        background: rgba(0,0,0,0.85); border: 1px solid var(--line);
        padding: 0.65rem 1rem; opacity: 0; pointer-events: none; transition: opacity 0.2s;
        z-index: 50; max-width: 90vw;
      }
      #toast.show { opacity: 1; }

      @media (max-width: 980px) {
        .trial-shell {
          grid-template-columns: 1fr;
          overflow: auto;
        }
        .stage-frame { min-height: 280px; }
      }
    </style>
  </head>
  <body>
    <h1 class="sr-only">지옥법정</h1>

    <section id="screen-title" class="screen active" aria-label="타이틀">
      <nav class="title-menu" id="titleMenu" aria-label="타이틀 메뉴"></nav>
    </section>

    <section id="screen-lobby" class="screen" aria-label="로비">
      <div class="lobby-card">
        <h1>공정의 법정 · 로비</h1>
        <div class="lobby-meta" id="lobbyMeta"></div>
        <div class="lobby-summary" id="lobbySummary">아직 판결 기록이 없습니다.</div>
        <div class="lobby-actions" id="lobbyActions"></div>
      </div>
    </section>

    <section id="screen-ingame" class="screen" aria-label="재판">
      <div class="trial-shell">
        <div class="col left-col">
          <div class="panel-box court-title" id="courtName">공정의 법정</div>
          <div class="panel-box">
            <div class="hud-row">
              <span class="hud-label">법정시간</span>
              <div class="seg-track" id="timeSegs"></div>
              <span class="hud-value" id="timeValue">8:00 / 8:00</span>
            </div>
            <div class="hud-row">
              <span class="hud-label">영 력</span>
              <div class="spirit-track"><div class="spirit-fill" id="spiritFill"></div></div>
              <span class="hud-value" id="spiritValue">10/10</span>
            </div>
          </div>
          <div class="panel-box guide-line" id="statusGuide">재판 시작</div>
          <div class="tabs" id="leftTabs">
            <button type="button" class="tab active" data-tab="events">사건 정보</button>
            <button type="button" class="tab" data-tab="detail">상세정보</button>
            <button type="button" class="tab" data-tab="menu">메뉴</button>
          </div>
          <div class="list-box" id="leftList"></div>
          <div class="hint-bar">
            <span id="leftHint">SELECT</span>
            <span>←→ 탭 · ↑↓ · Enter</span>
          </div>
        </div>

        <div class="col stage-col">
          <div class="top-chips">
            <span id="chipStone">환생석 : 1개 · 영기 0</span>
            <span id="chipDays">환생문: 100일 · Day 1</span>
          </div>
          <div class="stage-frame" id="stageFrame">
            <div class="stage-speech" id="stageSpeech">
              <div id="stageMain">망자가 법정에 섰다.</div>
              <div class="sub" id="stageSub"></div>
            </div>
          </div>
        </div>

        <div class="col right-col">
          <div class="top-chips" style="justify-content:flex-end">
            <span>재판 도구 선택</span>
          </div>
          <div class="action-stack">
            <button type="button" class="action-btn" id="btnFact">
              <span class="icon">FACT</span>
              <span>
                <strong id="lblFact">사실 조사하기</strong>
                <span class="cost" id="costFact">법정시간 -30분</span>
              </span>
            </button>
            <button type="button" class="action-btn" id="btnEmotion">
              <span class="icon">EMO</span>
              <span>
                <strong id="lblEmotion">감정 들여다 보기</strong>
                <span class="cost" id="costEmotion">법정시간 -60분 · 영력 -2</span>
              </span>
            </button>
          </div>
          <div class="desc-box" id="descBox">사건을 선택하고 사실과 감정을 조사하십시오.</div>
          <div class="right-hint">SELECT (Space)</div>
        </div>
      </div>
    </section>

    <section id="screen-verdict" class="screen" aria-label="판결">
      <div class="verdict-card">
        <h2>판결</h2>
        <div class="verdict-warn" id="verdictWarn" hidden></div>
        <div class="verdict-choices">
          <button type="button" class="verdict-choice hell" data-choice="hell">지옥</button>
          <button type="button" class="verdict-choice heaven" data-choice="heaven">천국</button>
        </div>
        <label class="sr-only" for="verdictReason">판결 이유</label>
        <textarea id="verdictReason" placeholder="판결 이유를 적을 수 있습니다 (선택)"></textarea>
        <button type="button" class="verdict-submit" id="verdictSubmit">판결 확정</button>
      </div>
    </section>

    <section id="screen-end" class="screen" aria-label="판결 결과">
      <div class="end-overlay">
        <div id="endTitle" style="font-size:1.6rem;letter-spacing:0.1em;margin-bottom:0.5rem"></div>
        <div id="endSub" style="color:var(--muted)"></div>
        <nav class="end-menu" id="endMenu" aria-label="판결 후 메뉴">
          <button type="button" class="end-menu-item selected" data-end="next">다음 재판하기</button>
          <button type="button" class="end-menu-item" data-end="title">심판종료</button>
        </nav>
      </div>
    </section>

    <div id="toast" role="status"></div>

    <script src="assets/data/game-config.js"></script>
    <script src="assets/data/game-content.js"></script>
    <script src="assets/js/game.js"></script>
    <script>
      (function () {
        const Game = window.HellCourtGame;
        const ui = {
          screen: "title",
          titleIndex: 0,
          tab: "events",
          listIndex: 0,
          actionIndex: 0,
          focus: "list", // list | actions
          lobbyIndex: 0,
          verdictIndex: 0,
          endIndex: 0,
          busy: false,
        };

        const titleItems = [
          { id: "start", label: "재판 시작" },
          { id: "log", label: "로그 저장" },
        ];
        const menuItems = [
          { id: "verdict", label: "판결하기" },
          { id: "lobby", label: "로비로 나가기" },
          { id: "title", label: "타이틀로" },
        ];
        const endMenuItems = [
          { id: "next", label: "다음 재판하기" },
          { id: "title", label: "심판종료" },
        ];

        const BGM = {
          audio: null,
          track: null,
          muted: false,
          paths() {
            const a = (window.GAME_CONTENT && window.GAME_CONTENT.audio) || {};
            return {
              court: a.bgm || "assets/audio/bgm_strict_verdict.mp3",
              heaven: a.bgmHeaven || "assets/audio/bgm_heaven_end.wav",
              hell: a.bgmHell || "assets/audio/bgm_hell_end.wav",
            };
          },
          volume() {
            const b = (window.GAME_CONFIG && window.GAME_CONFIG.balance) || {};
            return b.bgmVolume != null ? b.bgmVolume : 0.45;
          },
          enabled() {
            const s = window.GAME_CONFIG && window.GAME_CONFIG.systems && window.GAME_CONFIG.systems.bgm;
            return !s || s.enabled !== false;
          },
          stop() {
            if (this.audio) {
              this.audio.pause();
              try { this.audio.currentTime = 0; } catch (e) {}
            }
            this.audio = null;
            this.track = null;
          },
          play(name) {
            if (!this.enabled() || this.muted) return;
            const path = this.paths()[name];
            if (!path) return;
            if (this.track === name && this.audio && !this.audio.paused) return;
            this.stop();
            this.track = name;
            this.audio = new Audio(path);
            this.audio.loop = true;
            this.audio.volume = this.volume();
            const p = this.audio.play();
            if (p && p.catch) p.catch(function () {});
          },
        };

        function playSfx(kind) {
          const sys = window.GAME_CONFIG && window.GAME_CONFIG.systems;
          if (kind === "select" && sys && sys.uiSelectSfx && sys.uiSelectSfx.enabled === false) return;
          if (kind === "confirm" && sys && sys.uiConfirmSfx && sys.uiConfirmSfx.enabled === false) return;
          const a = (window.GAME_CONTENT && window.GAME_CONTENT.audio) || {};
          const path =
            kind === "confirm"
              ? a.uiConfirm || "assets/audio/ui_confirm.mp3"
              : a.uiSelect || "assets/audio/ui_select.wav";
          const vol = ((window.GAME_CONFIG && window.GAME_CONFIG.balance) || {}).sfxVolume;
          const audio = new Audio(path);
          audio.volume = vol != null ? vol : 0.55;
          const p = audio.play();
          if (p && p.catch) p.catch(function () {});
        }

        function applyArt() {
          const art = Game.contentArt();
          if (art.titleBg) {
            document.getElementById("screen-title").style.setProperty("--title-bg", 'url("' + art.titleBg + '")');
          }
          if (art.ingameBg) {
            document.getElementById("screen-ingame").style.setProperty("--ingame-bg", 'url("' + art.ingameBg + '")');
          }
          if (art.stageSoul) {
            document.getElementById("stageFrame").style.setProperty("--stage-art", 'url("' + art.stageSoul + '")');
          }
        }

        function showScreen(id) {
          ui.screen = id;
          ["title", "lobby", "ingame", "verdict", "end"].forEach(function (name) {
            document.getElementById("screen-" + name).classList.toggle("active", name === id);
          });
        }

        function toast(msg) {
          const el = document.getElementById("toast");
          el.textContent = msg;
          el.classList.add("show");
          clearTimeout(ui._toast);
          ui._toast = setTimeout(function () {
            el.classList.remove("show");
          }, 1600);
        }

        function setStage(main, sub) {
          document.getElementById("stageMain").textContent = main || "";
          document.getElementById("stageSub").textContent = sub || "";
        }

        function renderTitle() {
          const menu = document.getElementById("titleMenu");
          menu.innerHTML = "";
          titleItems.forEach(function (item, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "title-item" + (i === ui.titleIndex ? " selected" : "");
            btn.textContent = item.label;
            btn.addEventListener("click", function () {
              ui.titleIndex = i;
              playSfx("select");
              confirmTitle();
            });
            menu.appendChild(btn);
          });
        }

        function confirmTitle() {
          playSfx("confirm");
          const item = titleItems[ui.titleIndex];
          if (!item) return;
          if (item.id === "log") {
            Game.downloadLog();
            toast("로그를 저장했습니다.");
            return;
          }
          Game.startNewRun();
          showScreen("lobby");
          renderLobby();
          setTimeout(function () { BGM.play("court"); }, 180);
        }

        function formatCostMinutes(n) {
          return "-" + n + "분";
        }

        function renderLobby() {
          const s = Game.state;
          if (!s || s.phase !== "lobby") return;
          const L = Game.labels();
          const timeLabel = Game.formatCourtTime(s.courtTimeMinutes);
          const canTrial = Game.canStartTrial();
          document.getElementById("lobbyMeta").textContent =
            "Day " + s.day +
            " · 법정시간 " + timeLabel +
            " · 영력 " + s.spirit + "/" + s.spiritMax +
            " · " + (L.essence || "영기") + " " + s.essence +
            " · 환생석 " + s.rebirthStones + "개 · 환생문 " + s.rebirthDaysLeft + "/" + s.rebirthDaysTotal + "일";
          const sum = s.lastSummary;
          const box = document.getElementById("lobbySummary");
          if (!sum) {
            box.textContent =
              "아직 판결 기록이 없습니다.\n" +
              "같은 날에는 법정시간이 이어집니다.\n" +
              "영력은 영기로만 회복됩니다.";
          } else {
            box.textContent =
              "직전 판결\n" +
              "망자: " + sum.deceasedName + "\n" +
              "판결: " + (sum.choice === "heaven" ? L.heaven : L.hell) +
              (sum.rushed ? " (성급)" : "") + "\n" +
              "사실 " + sum.factsRead + "/" + sum.eventCount +
              " · 감정 " + sum.emotionsRead + "/" + sum.eventCount + "\n" +
              "남은 법정시간 " + (sum.courtTimeLeftLabel || Game.formatCourtTime(sum.courtTimeMinutesLeft)) +
              " · 영력 " + sum.spiritLeft +
              "\n획득 " + (L.essence || "영기") + " +" + (sum.essenceGain != null ? sum.essenceGain : 0) +
              (sum.rushed ? " (성급·기운 보존)" : " (심문 소모)") +
              (sum.rebirthStoneGained ? " · 환생석 +1 (전부 열람)" : "") +
              (s.dayJustAdvanced ? "\n\n" + (L.dayEnded || "하루가 지나 법정시간이 회복되었습니다.") : "") +
              (!canTrial ? "\n\n" + (L.timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.") : "");
          }
          if (!sum && !canTrial) {
            box.textContent +=
              "\n\n" + (L.timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
          }
          const spBal = (Game.balance().spirit || {});
          const restoreCost = spBal.restoreCostEssence != null ? spBal.restoreCostEssence : 1;
          const restoreAmt = spBal.restoreAmount != null ? spBal.restoreAmount : 2;
          const actions = [
            {
              id: "next",
              label: canTrial ? "다음 재판 준비" : "다음 재판 준비 (법정시간 부족)",
              primary: canTrial,
              disabled: !canTrial,
            },
            {
              id: "restore",
              label: "영력 회복 (+" + restoreAmt + " / " + (L.essence || "영기") + " -" + restoreCost + ")",
            },
            {
              id: "endday",
              label: "하루 마치기 (법정시간 회복)",
              primary: !canTrial,
            },
            { id: "title", label: "타이틀로" },
          ];
          // 시간 소진 시 기본 선택을 '하루 마치기'로
          if (!canTrial) {
            const endIdx = actions.findIndex(function (a) { return a.id === "endday"; });
            if (ui.lobbyIndex === 0 || (ui._lobbyActions && ui._lobbyActions[ui.lobbyIndex] && ui._lobbyActions[ui.lobbyIndex].disabled)) {
              ui.lobbyIndex = endIdx >= 0 ? endIdx : 0;
            }
          }
          const wrap = document.getElementById("lobbyActions");
          wrap.innerHTML = "";
          actions.forEach(function (a, i) {
            const btn = document.createElement("button");
            btn.type = "button";
            btn.disabled = !!a.disabled;
            btn.className =
              "lobby-btn" +
              (a.primary ? " primary" : "") +
              (i === ui.lobbyIndex ? " selected" : "");
            btn.textContent = a.label;
            btn.addEventListener("click", function () {
              if (a.disabled) {
                toast(L.timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
                return;
              }
              ui.lobbyIndex = i;
              playSfx("select");
              confirmLobby();
            });
            wrap.appendChild(btn);
          });
          ui._lobbyActions = actions;
          if (ui.lobbyIndex >= actions.length) ui.lobbyIndex = 0;
        }

        function confirmLobby() {
          const a = (ui._lobbyActions || [])[ui.lobbyIndex];
          if (!a) return;
          if (a.disabled) {
            toast(Game.labels().timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
            return;
          }
          playSfx("confirm");
          if (a.id === "title") {
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          if (a.id === "restore") {
            const L = Game.labels();
            const r = Game.restoreSpirit();
            if (!r.ok) {
              if (r.reason === "no_essence") toast(L.essenceLow || "영기가 부족합니다.");
              else if (r.reason === "full") toast("영력이 이미 가득합니다.");
              else toast("회복할 수 없습니다.");
              renderLobby();
              return;
            }
            toast((L.spiritRestored || "영력을 회복했습니다.") + " (+" + r.amount + ")");
            renderLobby();
            return;
          }
          if (a.id === "endday") {
            Game.advanceDay();
            toast((Game.labels().dayEnded) || "하루가 지나 법정시간이 회복되었습니다.");
            ui.lobbyIndex = 0;
            renderLobby();
            return;
          }
          if (!Game.canStartTrial()) {
            toast(Game.labels().timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
            renderLobby();
            return;
          }
          const started = Game.startTrial();
          if (!started) {
            toast(Game.labels().timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
            renderLobby();
            return;
          }
          ui.tab = "events";
          ui.listIndex = 0;
          ui.focus = "list";
          showScreen("ingame");
          refreshTrial(true);
          BGM.play("court");
        }

        function refreshTrial(fresh) {
          const s = Game.state;
          if (!s || s.phase !== "trial") return;
          const L = Game.labels();
          document.getElementById("courtName").textContent = s.courtName || L.courtName;
          document.getElementById("chipStone").textContent =
            "환생석 : " + s.rebirthStones + "개 · " + (L.essence || "영기") + " " + s.essence;
          document.getElementById("chipDays").textContent = "환생문: " + s.rebirthDaysLeft + "일 · Day " + s.day;

          const hours = s.courtTimeHours || 8;
          const hoursLeft = Math.ceil((s.courtTimeMinutes || 0) / 60);
          const segs = document.getElementById("timeSegs");
          segs.innerHTML = "";
          for (let i = 0; i < hours; i++) {
            const d = document.createElement("span");
            d.className = "seg" + (i < hoursLeft ? " on" : "");
            segs.appendChild(d);
          }
          document.getElementById("timeValue").textContent =
            Game.formatCourtTime(s.courtTimeMinutes) + " / " + hours + ":00";
          const maxS = s.spiritMax || 10;
          document.getElementById("spiritFill").style.width = Math.round((s.spirit / maxS) * 100) + "%";
          document.getElementById("spiritValue").textContent = s.spirit + "/" + maxS;

          const costs = Game.actionCosts();
          document.getElementById("lblFact").textContent = L.factAction || "사실 조사하기";
          document.getElementById("lblEmotion").textContent = L.emotionAction || "감정 들여다 보기";
          document.getElementById("costFact").textContent = "법정시간 " + formatCostMinutes(costs.factTime);
          document.getElementById("costEmotion").textContent =
            "법정시간 " + formatCostMinutes(costs.emotionTime) + " · 영력 -" + costs.emotionSpirit;

          document.querySelectorAll("#leftTabs .tab").forEach(function (t) {
            t.classList.toggle("active", t.getAttribute("data-tab") === ui.tab);
          });

          renderLeftList();
          renderActions();
          updateGuide();
          updateDesc();

          if (fresh) {
            setStage(s.intro || "망자가 법정에 섰다.", "인생 사건의 연표를 확인하십시오.");
          }
        }

        function readLabel(ev) {
          if (ev.factRead && ev.emotionRead) return "사실·감정 열람";
          if (ev.factRead) return "사실 열람";
          return "미열람";
        }

        function renderLeftList() {
          const s = Game.state;
          const list = document.getElementById("leftList");
          list.innerHTML = "";
          if (ui.tab === "events") {
            document.getElementById("leftHint").textContent = "SELECT";
            const events = s.events || [];
            ui.listIndex = Math.max(0, Math.min(ui.listIndex, Math.max(0, events.length - 1)));
            events.forEach(function (ev, i) {
              const row = document.createElement("div");
              row.className = "event-row" + (i === ui.listIndex && ui.focus === "list" ? " selected" : "");
              const cur = document.createElement("span");
              cur.className = "cursor";
              cur.textContent = i === ui.listIndex ? "▶" : "";
              const body = document.createElement("div");
              const title = document.createElement("div");
              title.className = "event-title";
              title.textContent = ev.year + " · " + ev.title;
              const meta = document.createElement("div");
              meta.className = "event-meta";
              meta.textContent = readLabel(ev);
              body.appendChild(title);
              body.appendChild(meta);
              row.appendChild(cur);
              row.appendChild(body);
              row.addEventListener("click", function () {
                ui.focus = "list";
                ui.listIndex = i;
                playSfx("select");
                Game.selectEvent(ev.id);
                refreshTrial();
                setStage("사건 선택 · " + ev.title, ev.summary || "선택 시 해당 사건을 조회할 수 있습니다.");
              });
              list.appendChild(row);
            });
            // keep selection synced
            if (events[ui.listIndex]) Game.selectEvent(events[ui.listIndex].id);
            return;
          }

          if (ui.tab === "detail") {
            document.getElementById("leftHint").textContent = "SCROLL";
            const div = document.createElement("div");
            div.className = "detail-body";
            const name = s.nameRevealed ? s.trueName : s.displayName;
            const vals = (s.values || []).join(", ") || "-";
            const life =
              s.birthYear != null || s.deathYear != null
                ? "생애: " +
                  (s.birthYear != null ? s.birthYear : "????") +
                  " – " +
                  (s.deathYear != null ? s.deathYear : "????") +
                  (s.ageAtDeath != null ? " (" + s.ageAtDeath + "세)" : "")
                : s.deathYear != null
                  ? "사망연도: " + s.deathYear
                  : "생애: ???";
            div.textContent =
              "이름: " + name + "\n" +
              "성별: " + (s.gender || "???") + "\n" +
              life + "\n" +
              "가치관: " + vals + "\n\n" +
              (s.profileNote || "");
            list.appendChild(div);
            return;
          }

          document.getElementById("leftHint").textContent = "SELECT";
          ui.listIndex = Math.max(0, Math.min(ui.listIndex, menuItems.length - 1));
          menuItems.forEach(function (item, i) {
            const row = document.createElement("div");
            row.className = "menu-row" + (i === ui.listIndex && ui.focus === "list" ? " selected" : "");
            const cur = document.createElement("span");
            cur.className = "cursor";
            cur.textContent = i === ui.listIndex ? "▶" : "";
            const lab = document.createElement("div");
            lab.textContent = item.label;
            row.appendChild(cur);
            row.appendChild(lab);
            row.addEventListener("click", function () {
              ui.focus = "list";
              ui.listIndex = i;
              playSfx("select");
              confirmMenu();
            });
            list.appendChild(row);
          });
        }

        function renderActions() {
          const fact = document.getElementById("btnFact");
          const emo = document.getElementById("btnEmotion");
          fact.disabled = !Game.canInvestigateFact();
          emo.disabled = !Game.canInvestigateEmotion();
          fact.classList.toggle("selected", ui.focus === "actions" && ui.actionIndex === 0);
          emo.classList.toggle("selected", ui.focus === "actions" && ui.actionIndex === 1);
        }

        function updateGuide() {
          const s = Game.state;
          const ev = Game.getSelectedEvent();
          let g = "재판 시작";
          if (ev) g = ev.year + " · " + ev.title;
          if ((s.courtTimeMinutes || 0) <= 0) g = "법정시간 소진 — 판결을 고려하십시오";
          document.getElementById("statusGuide").textContent = g;
        }

        function updateDesc() {
          const ev = Game.getSelectedEvent();
          const box = document.getElementById("descBox");
          if (!ev) {
            box.textContent = "사건을 선택하십시오.";
            return;
          }
          let t = ev.summary || "";
          if (ev.factRead) t += (t ? "\n\n" : "") + "[사실]\n" + ev.factText;
          if (ev.emotionRead) t += (t ? "\n\n" : "") + "[감정]\n" + ev.emotionText;
          if (!ev.factRead) t += (t ? "\n\n" : "") + "아직 사실을 조사하지 않았습니다.";
          else if (!ev.emotionRead) t += "\n\n감정은 아직 들여다보지 않았습니다.";
          box.textContent = t;
        }

        function doFact() {
          if (ui.busy) return;
          const r = Game.investigateFact();
          if (!r.ok) {
            const L = Game.labels();
            if (r.reason === "no_time") toast(L.timeExpired || "시간이 부족합니다.");
            else if (r.reason === "already") toast("이미 조사한 사실입니다.");
            else playSfx("select");
            refreshTrial();
            return;
          }
          playSfx("confirm");
          setStage("사실 조사", r.text + (r.nameRevealed ? "\n\n정체가 드러났다: " + Game.state.displayName : ""));
          refreshTrial();
        }

        function doEmotion() {
          if (ui.busy) return;
          const L = Game.labels();
          const r = Game.investigateEmotion();
          if (!r.ok) {
            if (r.reason === "need_fact") toast(L.needFactFirst);
            else if (r.reason === "no_spirit") toast(L.spiritLow);
            else if (r.reason === "no_time") toast(L.timeExpired);
            else if (r.reason === "already") toast("이미 들여다본 감정입니다.");
            refreshTrial();
            return;
          }
          playSfx("confirm");
          setStage("감정 열람", r.text);
          refreshTrial();
        }

        function confirmMenu() {
          playSfx("confirm");
          const item = menuItems[ui.listIndex];
          if (!item) return;
          if (item.id === "verdict") openVerdict();
          else if (item.id === "lobby") {
            Game.finishToLobby();
            showScreen("lobby");
            renderLobby();
          } else if (item.id === "title") {
            BGM.stop();
            showScreen("title");
            renderTitle();
          }
        }

        let verdictChoice = "hell";

        function renderVerdictChoices() {
          document.querySelectorAll(".verdict-choice").forEach(function (btn) {
            const on = btn.getAttribute("data-choice") === verdictChoice;
            btn.classList.toggle("selected", on);
          });
        }

        function openVerdict() {
          playSfx("confirm");
          const opened = Game.openVerdict();
          verdictChoice = "hell";
          document.getElementById("verdictReason").value = "";
          const warn = document.getElementById("verdictWarn");
          warn.hidden = !(opened && opened.rushed);
          warn.textContent = Game.labels().karmaWarn || "";
          renderVerdictChoices();
          showScreen("verdict");
        }

        function submitVerdict() {
          const reason = document.getElementById("verdictReason").value || "";
          playSfx("confirm");
          const r = Game.submitVerdict(verdictChoice, reason);
          if (!r.ok) return;
          const L = Game.labels();
          const art = Game.contentArt();
          const end = document.getElementById("screen-end");
          if (verdictChoice === "heaven" && art.verdictInnocent) {
            end.style.backgroundImage = 'url("' + art.verdictInnocent + '")';
            BGM.play("heaven");
          } else if (art.verdictGuilty) {
            end.style.backgroundImage = 'url("' + art.verdictGuilty + '")';
            BGM.play("hell");
          } else {
            end.style.backgroundImage = "";
          }
          document.getElementById("endTitle").textContent =
            verdictChoice === "heaven" ? L.heaven : L.hell;
          document.getElementById("endSub").textContent = r.summary.rushed
            ? L.karmaEnd || ""
            : r.summary.deceasedName + "에 대한 판결이 내려졌다.";
          ui.endIndex = 0;
          renderEndMenu();
          showScreen("end");
        }

        function renderEndMenu() {
          const canTrial = Game.canStartTrial();
          endMenuItems[0] = canTrial
            ? { id: "next", label: "다음 재판하기" }
            : { id: "lobby", label: "로비로 (하루 회복 필요)" };
          endMenuItems[1] = { id: "title", label: "심판종료" };
          const buttons = document.querySelectorAll("#endMenu .end-menu-item");
          buttons.forEach(function (btn, i) {
            btn.classList.toggle("selected", i === ui.endIndex);
            if (endMenuItems[i]) {
              btn.textContent = endMenuItems[i].label;
              btn.setAttribute("data-end", endMenuItems[i].id);
            }
          });
        }

        function confirmEnd() {
          playSfx("confirm");
          const item = endMenuItems[ui.endIndex];
          if (!item) return;
          if (item.id === "title") {
            Game.finishToLobby();
            BGM.stop();
            showScreen("title");
            renderTitle();
            return;
          }
          // 다음 재판 / 로비 → 로비 진입 (시간 0이면 재판 불가, 하루 마치기 유도)
          Game.finishToLobby();
          showScreen("lobby");
          renderLobby();
          BGM.play("court");
          if (!Game.canStartTrial()) {
            toast(Game.labels().timeExhaustedNeedDay || "법정시간이 소진되었습니다. 하루를 마쳐 회복하십시오.");
          }
        }

        document.querySelectorAll(".verdict-choice").forEach(function (btn) {
          btn.addEventListener("click", function () {
            verdictChoice = btn.getAttribute("data-choice");
            playSfx("select");
            renderVerdictChoices();
          });
        });
        document.getElementById("verdictSubmit").addEventListener("click", function () {
          submitVerdict();
        });
        document.querySelectorAll("#endMenu .end-menu-item").forEach(function (btn, i) {
          btn.addEventListener("click", function () {
            ui.endIndex = i;
            playSfx("select");
            renderEndMenu();
            confirmEnd();
          });
        });

        const TAB_ORDER = ["events", "detail", "menu"];

        function setTab(name, opts) {
          const o = opts || {};
          if (TAB_ORDER.indexOf(name) < 0) return;
          ui.tab = name;
          ui.listIndex = 0;
          ui.focus = "list";
          if (!o.silent) playSfx("select");
          refreshTrial();
        }

        function cycleTab(dir) {
          const i = TAB_ORDER.indexOf(ui.tab);
          const next = TAB_ORDER[(i + dir + TAB_ORDER.length) % TAB_ORDER.length];
          setTab(next);
        }

        document.querySelectorAll("#leftTabs .tab").forEach(function (btn) {
          btn.addEventListener("click", function (e) {
            e.preventDefault();
            e.stopPropagation();
            setTab(btn.getAttribute("data-tab"));
          });
        });
        document.getElementById("btnFact").addEventListener("click", function () {
          ui.focus = "actions";
          ui.actionIndex = 0;
          doFact();
        });
        document.getElementById("btnEmotion").addEventListener("click", function () {
          ui.focus = "actions";
          ui.actionIndex = 1;
          doEmotion();
        });

        document.addEventListener("keydown", function (e) {
          if (ui.screen === "title") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.titleIndex = (ui.titleIndex + (e.key === "ArrowDown" ? 1 : -1) + titleItems.length) % titleItems.length;
              playSfx("select");
              renderTitle();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmTitle();
            }
            return;
          }
          if (ui.screen === "lobby") {
            const n = (ui._lobbyActions || []).length;
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              ui.lobbyIndex = (ui.lobbyIndex + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
              playSfx("select");
              renderLobby();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmLobby();
            }
            return;
          }
          if (ui.screen === "verdict") {
            if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
              e.preventDefault();
              verdictChoice = verdictChoice === "hell" ? "heaven" : "hell";
              playSfx("select");
              renderVerdictChoices();
            } else if (e.key === "Enter") {
              e.preventDefault();
              submitVerdict();
            }
            return;
          }
          if (ui.screen === "end") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.endIndex =
                (ui.endIndex + (e.key === "ArrowDown" ? 1 : -1) + endMenuItems.length) %
                endMenuItems.length;
              playSfx("select");
              renderEndMenu();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmEnd();
            }
            return;
          }
          if (ui.screen !== "ingame" || !Game.state || Game.state.phase !== "trial") return;

          if (e.key === "Tab") {
            e.preventDefault();
            cycleTab(e.shiftKey ? -1 : 1);
            return;
          }

          if (ui.focus === "actions") {
            if (e.key === "ArrowLeft") {
              e.preventDefault();
              ui.focus = "list";
              playSfx("select");
              refreshTrial();
              return;
            }
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.actionIndex = ui.actionIndex === 0 ? 1 : 0;
              playSfx("select");
              renderActions();
              return;
            }
            if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              if (ui.actionIndex === 0) doFact();
              else doEmotion();
            }
            return;
          }

          // left panel focus: ←→ switch tabs (메뉴에서 → 는 액션으로)
          if (e.key === "ArrowLeft") {
            e.preventDefault();
            cycleTab(-1);
            return;
          }
          if (e.key === "ArrowRight") {
            e.preventDefault();
            if (ui.tab === "menu") {
              ui.focus = "actions";
              playSfx("select");
              refreshTrial();
            } else {
              cycleTab(1);
            }
            return;
          }

          if (ui.tab === "events") {
            const n = (Game.state.events || []).length;
            if (!n) return;
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.listIndex = (ui.listIndex + (e.key === "ArrowDown" ? 1 : -1) + n) % n;
              playSfx("select");
              const ev = Game.state.events[ui.listIndex];
              if (ev) {
                Game.selectEvent(ev.id);
                setStage("사건 선택 · " + ev.title, ev.summary || "");
              }
              refreshTrial();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              ui.focus = "actions";
              playSfx("select");
              refreshTrial();
            }
          } else if (ui.tab === "menu") {
            if (e.key === "ArrowUp" || e.key === "ArrowDown") {
              e.preventDefault();
              ui.listIndex = (ui.listIndex + (e.key === "ArrowDown" ? 1 : -1) + menuItems.length) % menuItems.length;
              playSfx("select");
              renderLeftList();
            } else if (e.key === "Enter" || e.key === " ") {
              e.preventDefault();
              confirmMenu();
            }
          }
        });

        applyArt();
        renderTitle();
        console.info("[지옥법정] revision MVP boot", {
          config: window.GAME_CONFIG && window.GAME_CONFIG.version,
          content: window.GAME_CONTENT && window.GAME_CONTENT.version,
        });
      })();
    </script>
  </body>
</html>
